<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>work</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ================================================================
   Reset & Base
   ================================================================ */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 15px; scroll-behavior: smooth; }
body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  background: #0d1117;
  color: #e6edf3;
  line-height: 1.6;
  min-height: 100vh;
}
a { color: #58a6ff; text-decoration: none; }
a:hover { text-decoration: underline; }
button { cursor: pointer; font-family: inherit; }
input, textarea, select { font-family: inherit; }
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-track { background: #0d1117; }
::-webkit-scrollbar-thumb { background: #30363d; border-radius: 4px; }
::-webkit-scrollbar-thumb:hover { background: #484f58; }

/* ================================================================
   Navigation
   ================================================================ */
nav {
  position: fixed; top: 0; left: 0; right: 0; z-index: 1000;
  display: flex; align-items: center;
  height: 52px; padding: 0 24px;
  background: #161b22; border-bottom: 1px solid #30363d;
}
.logo {
  font-family: 'JetBrains Mono', monospace;
  font-weight: 700; font-size: 1.2rem;
  color: #58a6ff; margin-right: 32px;
  letter-spacing: -0.5px;
}
.nav-links {
  display: flex; align-items: center; gap: 0;
}
.nav-link {
  padding: 14px 16px; color: #7d8590;
  font-size: 0.9rem; font-weight: 500;
  border-bottom: 2px solid transparent;
  transition: color .15s, border-color .15s;
  text-decoration: none !important;
}
.nav-link:hover { color: #e6edf3; }
.nav-link.active { color: #e6edf3; border-bottom-color: #58a6ff; }
.nav-spacer { flex: 1; }
.nav-status {
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.75rem; color: #7d8590;
  display: flex; align-items: center; gap: 8px;
}
.status-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }
.status-active { background: #3fb950; }
.status-inactive { background: #f85149; }
.nav-status .last-analysis {
  color: #7d8590; font-size: 0.72rem;
}
.hamburger {
  display: none; background: none; border: none;
  color: #e6edf3; font-size: 1.4rem; padding: 8px;
  margin-right: 8px;
}

/* ================================================================
   Mobile Responsive
   ================================================================ */
@media (max-width: 768px) {
  .hamburger { display: block; }
  .nav-links {
    display: none; position: absolute; top: 52px; left: 0; right: 0;
    background: #161b22; border-bottom: 1px solid #30363d;
    flex-direction: column; padding: 8px 0;
    overflow-x: auto;
  }
  .nav-links.open { display: flex; }
  .nav-link { padding: 12px 24px; border-bottom: none; }
  .nav-link.active { background: #1c2128; }
  #app { padding: 64px 16px 70px !important; }
  .goal-grid { grid-template-columns: 1fr !important; }
  .contacts-grid { grid-template-columns: 1fr !important; }
  .proposed-card-grid { grid-template-columns: 1fr !important; }
  .stats-bar { flex-direction: column; gap: 12px !important; }
  .stat { text-align: left; display: flex; gap: 8px; align-items: baseline; }
  .detail-header { flex-direction: column; align-items: flex-start !important; }
  .msg { max-width: 90% !important; }
  .signal-table-wrap { font-size: 0.8rem; }
  .signal-table td, .signal-table th { padding: 6px 8px !important; }
  .activity-filters { flex-direction: column; }
  .activity-filters input { min-width: auto !important; }
}

/* ================================================================
   Layout
   ================================================================ */
#app {
  max-width: 1200px; margin: 0 auto;
  padding: 72px 24px 70px;
  min-height: 100vh;
}

/* ================================================================
   Cards
   ================================================================ */
.card {
  background: #161b22; border: 1px solid #30363d;
  border-radius: 8px; padding: 16px;
}

/* ================================================================
   Badges
   ================================================================ */
.badge {
  display: inline-block; padding: 2px 10px;
  border-radius: 12px; font-size: 0.72rem;
  font-weight: 600; text-transform: uppercase;
  letter-spacing: 0.5px;
  font-family: 'JetBrains Mono', monospace;
}
.badge-blue { background: rgba(88,166,255,.15); color: #58a6ff; }
.badge-green { background: rgba(63,185,80,.15); color: #3fb950; }
.badge-yellow { background: rgba(210,153,34,.15); color: #d29922; }
.badge-red { background: rgba(248,81,73,.15); color: #f85149; }
.badge-purple { background: rgba(188,140,255,.15); color: #bc8cff; }
.badge-gray { background: rgba(125,133,144,.15); color: #7d8590; }

/* Source-specific badges */
.source-badge {
  display: inline-block; padding: 2px 10px;
  border-radius: 12px; font-size: 0.72rem;
  font-weight: 600; text-transform: lowercase;
  letter-spacing: 0.3px;
  font-family: 'JetBrains Mono', monospace;
}
.source-imessage { background: rgba(0,188,212,.12); color: #00bcd4; }
.source-whatsapp { background: rgba(37,211,102,.12); color: #25d366; }
.source-screenshot { background: rgba(88,166,255,.12); color: #58a6ff; }
.source-email { background: rgba(0,172,193,.12); color: #00acc1; }
.source-calendar { background: rgba(63,185,80,.12); color: #3fb950; }
.source-clipboard { background: rgba(188,140,255,.12); color: #bc8cff; }
.source-active_app { background: rgba(121,192,255,.12); color: #79c0ff; }
.source-drive { background: rgba(210,168,255,.12); color: #d2a8ff; }
.source-tasks { background: rgba(230,237,243,.12); color: #e6edf3; }
.source-default { background: rgba(125,133,144,.12); color: #7d8590; }

/* Confidence badges */
.conf-high { background: rgba(63,185,80,.15); color: #3fb950; }
.conf-medium { background: rgba(210,153,34,.15); color: #d29922; }
.conf-low { background: rgba(125,133,144,.15); color: #7d8590; }

/* ================================================================
   Buttons
   ================================================================ */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  padding: 7px 16px; border-radius: 6px;
  font-size: 0.85rem; font-weight: 500;
  border: 1px solid #30363d; background: #21262d;
  color: #e6edf3; transition: all .15s;
  white-space: nowrap;
}
.btn:hover { background: #30363d; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn-primary { background: #238636; border-color: #2ea043; color: #fff; }
.btn-primary:hover { background: #2ea043; }
.btn-danger { background: #da3633; border-color: #f85149; }
.btn-danger:hover { background: #f85149; }
.btn-accent { background: #1f6feb; border-color: #58a6ff; }
.btn-accent:hover { background: #388bfd; }
.btn-sm { padding: 4px 10px; font-size: 0.78rem; }
.btn-lg { padding: 10px 24px; font-size: 0.95rem; font-weight: 600; }
.btn-dismiss { background: #30363d; border-color: #484f58; }
.btn-dismiss:hover { background: #484f58; }

/* ================================================================
   Modals
   ================================================================ */
.modal-overlay {
  position: fixed; inset: 0; z-index: 2000;
  background: rgba(0,0,0,.6); display: flex;
  align-items: center; justify-content: center;
  opacity: 0; pointer-events: none; transition: opacity .2s;
}
.modal-overlay.open { opacity: 1; pointer-events: auto; }
.modal {
  background: #161b22; border: 1px solid #30363d;
  border-radius: 12px; padding: 24px;
  width: 90%; max-width: 520px; max-height: 85vh;
  overflow-y: auto;
}
.modal h2 { font-size: 1.2rem; margin-bottom: 20px; }
.form-group { margin-bottom: 16px; }
.form-group label {
  display: block; font-size: 0.85rem; font-weight: 500;
  color: #7d8590; margin-bottom: 6px;
}
.form-group input, .form-group textarea, .form-group select {
  width: 100%; padding: 8px 12px;
  background: #0d1117; border: 1px solid #30363d;
  border-radius: 6px; color: #e6edf3; font-size: 0.9rem;
}
.form-group textarea { resize: vertical; min-height: 80px; }
.form-group input:focus, .form-group textarea:focus, .form-group select:focus {
  outline: none; border-color: #58a6ff;
}
.form-actions {
  display: flex; gap: 8px; justify-content: flex-end; margin-top: 20px;
}

/* ================================================================
   Sections
   ================================================================ */
.section { margin-bottom: 24px; }
.section-title {
  font-size: 0.85rem; font-weight: 600;
  text-transform: uppercase; letter-spacing: 1px;
  color: #7d8590; margin-bottom: 12px;
  display: flex; align-items: center; gap: 8px;
}
.section-title .count {
  background: #30363d; padding: 1px 8px;
  border-radius: 10px; font-size: 0.72rem;
}

/* ================================================================
   Page: Home
   ================================================================ */
.greeting {
  font-size: 1.8rem; font-weight: 700;
  margin-bottom: 24px;
}
.greeting .sub {
  display: block; font-size: 0.95rem;
  font-weight: 400; color: #7d8590; margin-top: 4px;
}

/* Proposed goal cards - prominent */
.proposed-card-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
  gap: 16px;
  margin-bottom: 24px;
}
.proposed-card {
  background: #161b22;
  border: 1px solid #30363d;
  border-left: 4px solid #d29922;
  border-radius: 8px;
  padding: 20px;
  display: flex; flex-direction: column;
}
.proposed-card .proposed-name {
  font-weight: 700; font-size: 1.2rem;
  margin-bottom: 8px;
  color: #e6edf3;
}
.proposed-card .proposed-desc {
  color: #c9d1d9; font-size: 0.92rem;
  margin-bottom: 12px; line-height: 1.6;
  flex: 1;
}
.proposed-card .proposed-evidence {
  font-size: 0.82rem; color: #7d8590;
  margin-bottom: 16px;
  padding: 10px 12px;
  background: #0d1117;
  border-radius: 6px;
  border-left: 2px solid #d29922;
}
.proposed-evidence-title {
  font-weight: 600; color: #d29922;
  font-size: 0.75rem; text-transform: uppercase;
  letter-spacing: 0.5px; margin-bottom: 6px;
}
.proposed-evidence-item {
  padding: 3px 0; color: #c9d1d9;
  word-wrap: break-word;
}
.proposed-actions {
  display: flex; gap: 10px; margin-top: auto;
}

.highlight-item {
  padding: 12px 0;
  border-bottom: 1px solid #21262d;
}
.highlight-item:last-child { border-bottom: none; }
.highlight-goal {
  font-weight: 600; display: flex; align-items: center; gap: 6px;
}
.highlight-signal {
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.82rem; color: #e6edf3;
  background: #0d1117; padding: 8px 12px;
  border-radius: 4px; margin: 6px 0;
  border-left: 2px solid #30363d;
  white-space: pre-wrap; word-wrap: break-word;
  word-break: break-word;
}
.highlight-reasoning {
  font-size: 0.82rem; color: #7d8590; font-style: italic;
}
.stats-bar {
  display: flex; gap: 24px; flex-wrap: wrap;
  padding: 16px 20px;
}
.stat { text-align: center; }
.stat-value {
  font-family: 'JetBrains Mono', monospace;
  font-size: 1.5rem; font-weight: 700; color: #58a6ff;
}
.stat-label {
  font-size: 0.75rem; color: #7d8590;
  text-transform: uppercase; letter-spacing: 0.5px;
}

/* ================================================================
   Page: Goals
   ================================================================ */
.page-header {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 24px;
}
.page-header h1 { font-size: 1.6rem; font-weight: 700; }
.scope-section { margin-bottom: 24px; }
.scope-label {
  font-size: 0.9rem; font-weight: 600;
  color: #7d8590; margin-bottom: 12px;
  text-transform: capitalize;
}
.goal-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
  gap: 12px;
}
.goal-card {
  cursor: pointer; transition: border-color .15s, transform .1s;
  padding: 16px;
}
.goal-card:hover { border-color: #58a6ff; transform: translateY(-1px); }
.goal-icon { font-size: 2rem; margin-bottom: 8px; }
.goal-name { font-weight: 600; font-size: 1rem; }
.goal-desc {
  color: #7d8590; font-size: 0.85rem;
  margin-top: 4px;
  display: -webkit-box; -webkit-line-clamp: 2;
  -webkit-box-orient: vertical; overflow: hidden;
}
.goal-meta {
  display: flex; gap: 12px; margin-top: 12px;
  font-size: 0.78rem; color: #7d8590;
  font-family: 'JetBrains Mono', monospace;
}

/* ================================================================
   Page: Goal Detail
   ================================================================ */
.back-link {
  display: inline-flex; align-items: center; gap: 6px;
  color: #7d8590; font-size: 0.9rem; margin-bottom: 16px;
}
.back-link:hover { color: #e6edf3; text-decoration: none; }
.detail-header {
  display: flex; align-items: center; gap: 16px;
  margin-bottom: 24px; flex-wrap: wrap;
}
.detail-icon { font-size: 2.5rem; }
.detail-name { font-size: 1.6rem; font-weight: 700; }
.detail-desc {
  color: #c9d1d9; font-size: 0.95rem; margin-bottom: 24px;
  line-height: 1.7; white-space: pre-wrap;
}
.people-tags { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 24px; }
.person-tag {
  padding: 3px 12px; border-radius: 12px;
  font-size: 0.8rem; font-weight: 500;
  background: rgba(188,140,255,.12); color: #bc8cff;
}
.timeline-item {
  padding: 16px; margin-bottom: 8px;
  border-left: 3px solid #30363d;
  border-radius: 0 8px 8px 0;
  background: #161b22; border-top: 1px solid #30363d;
  border-right: 1px solid #30363d; border-bottom: 1px solid #30363d;
}
.timeline-meta {
  display: flex; align-items: center; gap: 8px;
  margin-bottom: 8px; flex-wrap: wrap;
}
.timeline-time {
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.78rem; color: #7d8590;
}
.timeline-signal {
  font-size: 0.88rem;
  background: #0d1117;
  padding: 10px 14px; border-radius: 6px;
  margin: 8px 0; white-space: pre-wrap;
  word-wrap: break-word; word-break: break-word;
  line-height: 1.6; color: #e6edf3;
}
.timeline-reasoning {
  font-size: 0.82rem; color: #7d8590;
  font-style: italic; margin-top: 6px;
  padding-left: 12px;
  border-left: 2px solid #30363d;
}
.timeline-action {
  font-size: 0.82rem; color: #d29922; margin-top: 4px;
}
.memory-list { list-style: none; }
.memory-list li {
  padding: 6px 0; font-size: 0.9rem;
  border-bottom: 1px solid #21262d;
}
.memory-list li::before {
  content: '\2022'; color: #58a6ff; margin-right: 8px;
}
.action-item {
  display: flex; align-items: flex-start; gap: 10px;
  padding: 8px 0; border-bottom: 1px solid #21262d;
}
.action-checkbox {
  width: 18px; height: 18px; margin-top: 2px;
  border: 2px solid #30363d; border-radius: 4px;
  flex-shrink: 0;
}
.pending-item .pending-title {
  font-weight: 600; margin-bottom: 4px;
}
.pending-item .pending-desc {
  font-size: 0.85rem; color: #7d8590; margin-bottom: 8px;
}
.pending-content-preview {
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.8rem; background: #0d1117;
  padding: 8px 12px; border-radius: 4px;
  margin-bottom: 12px; max-height: 80px;
  overflow: hidden; cursor: pointer;
  transition: max-height .3s; white-space: pre-wrap;
}
.pending-content-preview.expanded { max-height: 600px; overflow-y: auto; }
.pending-actions { display: flex; gap: 6px; }

/* ================================================================
   Page: Chat
   ================================================================ */
.chat-container {
  display: flex; flex-direction: column;
  height: calc(100vh - 130px);
}
.chat-messages {
  flex: 1; overflow-y: auto; padding: 16px 0;
  display: flex; flex-direction: column; gap: 12px;
}
.chat-welcome {
  text-align: center; padding: 60px 20px;
  color: #7d8590;
}
.chat-welcome h2 {
  font-size: 1.3rem; color: #e6edf3; margin-bottom: 12px;
}
.msg { max-width: 75%; padding: 12px 16px; border-radius: 12px; font-size: 0.92rem; }
.msg-user {
  align-self: flex-end; background: #1f6feb;
  border-bottom-right-radius: 4px;
}
.msg-agent {
  align-self: flex-start; background: #161b22;
  border: 1px solid #30363d; border-bottom-left-radius: 4px;
}
.msg-proactive {
  align-self: flex-start; background: #161b22;
  border: 1px solid #30363d; border-left: 3px solid #d29922;
  border-bottom-left-radius: 4px;
}
.msg-time {
  font-size: 0.7rem; color: #7d8590; margin-top: 4px;
  font-family: 'JetBrains Mono', monospace;
}
.msg-content { line-height: 1.6; }
.msg-content p { margin-bottom: 8px; }
.msg-content p:last-child { margin-bottom: 0; }
.msg-content code {
  font-family: 'JetBrains Mono', monospace;
  background: #0d1117; padding: 1px 5px;
  border-radius: 3px; font-size: 0.85em;
}
.msg-content pre {
  background: #0d1117; padding: 12px;
  border-radius: 6px; overflow-x: auto;
  margin: 8px 0;
}
.msg-content pre code { padding: 0; background: none; }
.msg-content ul, .msg-content ol { padding-left: 20px; margin: 6px 0; }
.msg-content li { margin-bottom: 4px; }
.msg-content h1, .msg-content h2, .msg-content h3 {
  margin: 10px 0 6px; font-size: 1rem;
}
.msg-content strong { color: #fff; }
.msg-content blockquote {
  border-left: 3px solid #30363d; padding-left: 12px;
  color: #7d8590; margin: 8px 0;
}
.chat-input-bar {
  display: flex; gap: 8px; align-items: flex-end;
  padding: 12px 0;
  border-top: 1px solid #30363d;
}
.chat-textarea {
  flex: 1; background: #0d1117; border: 1px solid #30363d;
  border-radius: 8px; padding: 10px 14px; color: #e6edf3;
  font-size: 0.92rem; resize: none;
  min-height: 42px; max-height: 120px;
  line-height: 1.5;
}
.chat-textarea:focus { outline: none; border-color: #58a6ff; }
.chat-send { padding: 10px 20px; height: 42px; }
.thinking {
  align-self: flex-start; color: #7d8590;
  font-size: 0.85rem; padding: 8px 16px;
}
.thinking-dots::after {
  content: ''; animation: dots 1.4s infinite;
}
@keyframes dots {
  0%, 20% { content: '.'; }
  40% { content: '..'; }
  60%, 100% { content: '...'; }
}

/* ================================================================
   Page: Activity
   ================================================================ */
.activity-filters {
  display: flex; gap: 12px; margin-bottom: 16px; flex-wrap: wrap;
}
.activity-filters select, .activity-filters input {
  background: #0d1117; border: 1px solid #30363d;
  border-radius: 6px; padding: 6px 12px;
  color: #e6edf3; font-size: 0.85rem;
}
.activity-filters input { min-width: 200px; }
.activity-filters select:focus, .activity-filters input:focus {
  outline: none; border-color: #58a6ff;
}
.signal-table-wrap {
  overflow-x: auto; padding: 0;
}
.signal-table { width: 100%; border-collapse: collapse; table-layout: fixed; }
.signal-table th {
  text-align: left; padding: 10px 12px;
  font-size: 0.75rem; color: #7d8590;
  text-transform: uppercase; letter-spacing: 0.5px;
  border-bottom: 1px solid #30363d;
  font-family: 'JetBrains Mono', monospace;
}
.signal-table td {
  padding: 10px 12px; border-bottom: 1px solid #21262d;
  font-size: 0.85rem; vertical-align: top;
}
/* Column widths */
.signal-table .col-time { width: 140px; }
.signal-table .col-source { width: 100px; }
.signal-table .col-sender { width: 180px; }
.signal-table .col-signal { /* flex: takes remaining space */ }
/* Alternating row backgrounds */
.signal-table tbody tr:nth-child(even) { background: #161b22; }
.signal-table tbody tr:nth-child(odd) { background: #0d1117; }
.signal-table tbody tr:hover { background: #1c2128; }
/* Signal text wrapping */
.signal-text {
  white-space: pre-wrap;
  word-wrap: break-word;
  word-break: break-word;
  line-height: 1.5;
}
.analysis-entry {
  padding: 12px 16px; margin-bottom: 6px;
  cursor: pointer;
}
.analysis-entry:hover { border-color: #484f58; }
.analysis-summary {
  display: flex; gap: 16px; font-size: 0.85rem; flex-wrap: wrap;
  align-items: center;
}
.analysis-detail {
  display: none; margin-top: 12px; padding-top: 12px;
  border-top: 1px solid #21262d; font-size: 0.85rem;
}
.analysis-entry.expanded .analysis-detail { display: block; }

/* ================================================================
   Utilities
   ================================================================ */
.empty-state {
  text-align: center; padding: 40px 20px;
  color: #7d8590; font-size: 0.9rem;
  line-height: 1.7;
}
.empty-state .empty-hint {
  margin-top: 8px; font-size: 0.82rem; color: #484f58;
}
.spinner {
  display: inline-block; width: 14px; height: 14px;
  border: 2px solid #30363d; border-top-color: #58a6ff;
  border-radius: 50%; animation: spin .6s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.hidden { display: none !important; }
.mt-8 { margin-top: 8px; }
.mt-16 { margin-top: 16px; }
.mb-8 { margin-bottom: 8px; }
.mb-16 { margin-bottom: 16px; }

/* ================================================================
   Chat Bar (persistent bottom bar)
   ================================================================ */
#chat-bar {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 1000;
  height: 50px; background: #161b22;
  border-top: 1px solid #30363d;
  display: flex; align-items: center; gap: 8px;
  padding: 0 24px;
}
#chat-bar-input {
  flex: 1; background: #0d1117; border: 1px solid #30363d;
  border-radius: 6px; padding: 8px 14px; color: #e6edf3;
  font-size: 0.9rem; outline: none;
}
#chat-bar-input:focus { border-color: #58a6ff; }
#chat-bar-send {
  padding: 8px 16px; height: 36px;
  font-size: 0.85rem;
}

/* Chat Panel (slides up from bar) */
#chat-panel {
  position: fixed; bottom: 50px; left: 0; right: 0;
  height: 60vh; z-index: 999;
  background: #0d1117; border-top: 1px solid #30363d;
  transform: translateY(100%);
  transition: transform 0.3s ease;
  display: flex; flex-direction: column;
}
#chat-panel.open { transform: translateY(0); }
#chat-panel-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 10px 24px; background: #161b22;
  border-bottom: 1px solid #30363d;
}
#chat-panel-header h3 { font-size: 0.95rem; font-weight: 600; }
#chat-panel-close {
  background: none; border: none; color: #7d8590;
  font-size: 1.2rem; cursor: pointer; padding: 4px 8px;
}
#chat-panel-close:hover { color: #e6edf3; }
#chat-panel-messages {
  flex: 1; overflow-y: auto; padding: 16px 24px;
  display: flex; flex-direction: column; gap: 12px;
}

/* Hide the chat bar when on the full Chat page */
body.on-chat-page #chat-bar,
body.on-chat-page #chat-panel { display: none; }

/* ================================================================
   Contact Cards
   ================================================================ */
.contact-card {
  background: #161b22; border: 1px solid #30363d;
  border-radius: 8px; padding: 14px 16px;
  display: flex; align-items: center; gap: 12px;
  margin-bottom: 8px;
}
.contact-card .contact-info { flex: 1; }
.contact-card .contact-name {
  font-weight: 600; font-size: 0.95rem;
}
.contact-card .contact-nickname {
  color: #7d8590; font-size: 0.85rem;
}
.contact-card .contact-relationship {
  display: inline-block; padding: 1px 8px;
  border-radius: 10px; font-size: 0.7rem;
  font-weight: 600; text-transform: uppercase;
  background: rgba(63,185,80,.15); color: #3fb950;
  margin-left: 6px;
}
.contact-links {
  display: flex; gap: 8px; margin-top: 4px;
}
.contact-links a {
  font-size: 0.8rem; color: #58a6ff;
}
.contact-goals-list {
  display: flex; gap: 4px; flex-wrap: wrap; margin-top: 6px;
}
.contact-goal-tag {
  padding: 1px 8px; border-radius: 10px; font-size: 0.7rem;
  background: rgba(88,166,255,.12); color: #58a6ff;
}
.contact-actions-col {
  display: flex; gap: 4px;
}

/* ================================================================
   Contacts Page
   ================================================================ */
.contacts-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
  gap: 12px;
}

/* ================================================================
   Collapsible toggle
   ================================================================ */
.collapsible-toggle {
  background: none; border: none; color: #58a6ff;
  font-size: 0.82rem; cursor: pointer; padding: 4px 0;
}
.collapsible-toggle:hover { text-decoration: underline; }
</style>

<script>
/* ================================================================
   State
   ================================================================ */
const state = {
  currentPage: 'home',
  goals: [],
  proposed: [],
  pending: [],
  conversation: [],
  conversationKnownLen: 0,
  signals: [],
  analysis: [],
  memory: [],
  actions: [],
  scopes: [],
  contacts: [],
  signalSources: [],
  ws: null,
  chatSending: false,
  chatPanelOpen: false,
  editingPendingId: null,
  // Data hashes for smart polling (only re-render if data changed)
  _hashes: {},
};

const appEl = document.getElementById('app');

/* ================================================================
   Router
   ================================================================ */
function navigate(hash) {
  const raw = (hash || '#home').replace('#', '');
  state.currentPage = raw;
  updateNavLinks(raw);
  if (raw === 'chat') {
    document.body.classList.add('on-chat-page');
  } else {
    document.body.classList.remove('on-chat-page');
  }
  renderCurrentPage();
  closeMobileNav();
}

function updateNavLinks(page) {
  const base = page.split('/')[0];
  document.querySelectorAll('.nav-link').forEach(function(l) {
    var p = l.dataset.page;
    l.classList.toggle('active', p === base || (p === 'goals' && page.startsWith('goal/')) || (p === 'contacts' && page.startsWith('contact/')));
  });
}

window.onhashchange = function() { navigate(location.hash); };

function renderCurrentPage() {
  var page = state.currentPage;
  if (page === 'home') renderHome();
  else if (page === 'goals') renderGoals();
  else if (page.startsWith('goal/')) {
    var parts = page.split('/');
    var scope = parts[1];
    var name = decodeURIComponent(parts.slice(2).join('/'));
    renderGoalDetail(scope, name);
  }
  else if (page === 'contacts') renderContacts();
  else if (page === 'chat') renderChat();
  else if (page === 'activity') renderActivity();
  else renderHome();
  updateLastAnalysis();
  updateMonitorStatus();
}

/* ================================================================
   Helpers
   ================================================================ */
function esc(s) {
  if (s == null) return '';
  var d = document.createElement('div');
  d.textContent = String(s);
  return d.innerHTML;
}

function timeAgo(ts) {
  if (!ts) return '';
  var d = new Date(ts);
  var now = new Date();
  var diff = (now - d) / 1000;
  if (diff < 60) return 'just now';
  if (diff < 3600) return Math.floor(diff / 60) + 'm ago';
  if (diff < 86400) return Math.floor(diff / 3600) + 'h ago';
  return d.toLocaleDateString();
}

function fmtTime(ts) {
  if (!ts) return '';
  var d = new Date(ts);
  return d.toLocaleString(undefined, {
    month: 'short', day: 'numeric',
    hour: '2-digit', minute: '2-digit'
  });
}

function fmtTimeFull(ts) {
  if (!ts) return '';
  var d = new Date(ts);
  return d.toLocaleString(undefined, {
    year: 'numeric', month: 'short', day: 'numeric',
    hour: '2-digit', minute: '2-digit', second: '2-digit'
  });
}

function greeting() {
  var h = new Date().getHours();
  if (h < 12) return 'Good morning';
  if (h < 17) return 'Good afternoon';
  return 'Good evening';
}

function scopeLabel(scope, scopeName) {
  if (scopeName) return scope + ': ' + scopeName;
  return scope;
}

function scopeKey(scope, scopeName) {
  return scopeName ? scope + '/' + scopeName : scope;
}

function sourceBadgeClass(source) {
  var map = {
    imessage: 'source-imessage',
    whatsapp: 'source-whatsapp',
    screenshot: 'source-screenshot',
    email: 'source-email',
    calendar: 'source-calendar',
    clipboard: 'source-clipboard',
    active_app: 'source-active_app',
    drive: 'source-drive',
    tasks: 'source-tasks',
  };
  return 'source-badge ' + (map[source] || 'source-default');
}

function confBadgeClass(conf) {
  var upper = (conf || '').toUpperCase();
  if (upper === 'HIGH') return 'badge conf-high';
  if (upper === 'MEDIUM') return 'badge conf-medium';
  return 'badge conf-low';
}

function openModal(id) { document.getElementById(id).classList.add('open'); }
function closeModal(id) { document.getElementById(id).classList.remove('open'); }
function toggleMobileNav() { document.getElementById('navLinks').classList.toggle('open'); }
function closeMobileNav() { document.getElementById('navLinks').classList.remove('open'); }

function renderMarkdown(text) {
  if (!text) return '';
  var html = text;

  // Code blocks (fenced)
  html = html.replace(/```(\w*)\n([\s\S]*?)```/g, function(m, lang, code) {
    return '<pre><code>' + esc(code) + '</code></pre>';
  });

  // Inline code
  html = html.replace(/`([^`]+)`/g, function(m, code) {
    return '<code>' + esc(code) + '</code>';
  });

  // Headers
  html = html.replace(/^### (.+)$/gm, '<h3>$1</h3>');
  html = html.replace(/^## (.+)$/gm, '<h2>$1</h2>');
  html = html.replace(/^# (.+)$/gm, '<h1>$1</h1>');

  // Bold and italic
  html = html.replace(/\*\*\*(.+?)\*\*\*/g, '<strong><em>$1</em></strong>');
  html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  html = html.replace(/(?<!\*)\*(?!\*)(.+?)(?<!\*)\*(?!\*)/g, '<em>$1</em>');

  // Blockquotes
  html = html.replace(/^> (.+)$/gm, '<blockquote>$1</blockquote>');

  // Unordered lists
  html = html.replace(/^- (.+)$/gm, '<li>$1</li>');
  // Ordered lists
  html = html.replace(/^\d+\. (.+)$/gm, '<li>$1</li>');
  // Wrap consecutive li elements
  html = html.replace(/((?:<li>.*<\/li>\s*)+)/g, '<ul>$1</ul>');

  // Paragraphs
  html = html.split('\n\n').map(function(p) {
    p = p.trim();
    if (!p) return '';
    if (p.startsWith('<h') || p.startsWith('<pre') || p.startsWith('<ul') || p.startsWith('<ol') || p.startsWith('<blockquote'))
      return p;
    return '<p>' + p.replace(/\n/g, '<br>') + '</p>';
  }).join('');

  return html;
}

function simpleHash(str) {
  var hash = 0;
  for (var i = 0; i < str.length; i++) {
    hash = ((hash << 5) - hash) + str.charCodeAt(i);
    hash |= 0;
  }
  return hash;
}

function updateLastAnalysis() {
  var el = document.getElementById('lastAnalysisIndicator');
  if (!el) return;
  if (state.analysis.length > 0) {
    var last = state.analysis[state.analysis.length - 1];
    var ts = last.timestamp || last.ts;
    if (ts) {
      el.textContent = 'Last analysis: ' + timeAgo(ts);
    }
  }
}

async function updateMonitorStatus() {
  try {
    var status = await api('/api/status');
    var el = document.getElementById('monitorStatus');
    if (!el) return;
    if (status.monitor_running) {
      el.innerHTML = '<span class="status-dot status-active"></span> monitoring';
    } else {
      el.innerHTML = '<span class="status-dot status-inactive"></span> stopped';
    }
    // Update last analysis time
    if (status.last_analysis_time) {
      var ago = timeAgo(status.last_analysis_time);
      var la = document.getElementById('lastAnalysisIndicator');
      if (la) la.textContent = 'Last analysis: ' + ago;
    }
  } catch(e) {}
}
// Poll every 10 seconds
setInterval(updateMonitorStatus, 10000);

/* ================================================================
   API
   ================================================================ */
async function api(path, opts) {
  opts = opts || {};
  var resp = await fetch(path, Object.assign({
    headers: { 'Content-Type': 'application/json' },
  }, opts));
  if (!resp.ok) throw new Error('API ' + resp.status);
  return resp.json();
}

async function loadGoals() {
  try { state.goals = await api('/api/goals'); } catch(e) { console.error('loadGoals', e); }
}
async function loadProposed() {
  try { state.proposed = await api('/api/proposed'); } catch(e) { console.error('loadProposed', e); }
}
async function loadPending() {
  try { state.pending = await api('/api/pending'); } catch(e) { console.error('loadPending', e); }
}
async function loadMemory() {
  try { state.memory = await api('/api/memory'); } catch(e) { console.error('loadMemory', e); }
}
async function loadActions() {
  try { state.actions = await api('/api/actions'); } catch(e) { console.error('loadActions', e); }
}
async function loadAnalysis() {
  try { state.analysis = await api('/api/analysis?limit=50'); } catch(e) { console.error('loadAnalysis', e); }
}
async function loadSignals(params) {
  try {
    params = params || {};
    var q = '/api/signals?limit=200';
    if (params.source) q += '&source=' + encodeURIComponent(params.source);
    if (params.search) q += '&search=' + encodeURIComponent(params.search);
    state.signals = await api(q);
  } catch(e) { console.error('loadSignals', e); }
}
async function loadConversation() {
  try {
    var msgs = await api('/api/chat?limit=100');
    if (msgs.length !== state.conversationKnownLen) {
      state.conversation = msgs;
      state.conversationKnownLen = msgs.length;
      if (state.currentPage === 'chat') renderChatMessages();
      if (state.chatPanelOpen) renderChatPanelMessages();
    }
  } catch(e) { console.error('loadConversation', e); }
}
async function loadSignalSources() {
  try { state.signalSources = await api('/api/signals/sources'); } catch(e) { console.error('loadSources', e); }
}
async function loadScopes() {
  try { state.scopes = await api('/api/scopes'); } catch(e) { console.error('loadScopes', e); }
}
async function loadContacts() {
  try { state.contacts = await api('/api/contacts'); } catch(e) { console.error('loadContacts', e); }
}

async function loadAll() {
  await Promise.all([
    loadGoals(), loadProposed(), loadPending(),
    loadMemory(), loadActions(), loadAnalysis(),
    loadSignals(), loadConversation(),
    loadSignalSources(), loadScopes(), loadContacts(),
  ]);
  renderCurrentPage();
}

/* Smart polling: only re-render if data actually changed */
async function pollGoals() {
  var before = JSON.stringify(state.goals);
  await loadGoals();
  if (JSON.stringify(state.goals) !== before && (state.currentPage === 'goals' || state.currentPage === 'home')) {
    renderCurrentPage();
  }
}
async function pollProposed() {
  var before = JSON.stringify(state.proposed);
  await loadProposed();
  if (JSON.stringify(state.proposed) !== before && (state.currentPage === 'home' || state.currentPage === 'goals')) {
    renderCurrentPage();
  }
}
async function pollPending() {
  var before = JSON.stringify(state.pending);
  await loadPending();
  if (JSON.stringify(state.pending) !== before) {
    if (state.currentPage === 'home' || state.currentPage.startsWith('goal/')) {
      renderCurrentPage();
    }
  }
}
async function pollAnalysis() {
  var before = state.analysis.length;
  await loadAnalysis();
  updateLastAnalysis();
  if (state.analysis.length !== before && (state.currentPage === 'home' || state.currentPage === 'activity')) {
    renderCurrentPage();
  }
}

/* ================================================================
   WebSocket
   ================================================================ */
function connectWS() {
  try {
    var proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
    state.ws = new WebSocket(proto + '//' + location.host + '/ws/signals');
    state.ws.onmessage = function(e) {
      try {
        var signal = JSON.parse(e.data);
        state.signals.push(signal);
        if (state.signals.length > 500) state.signals = state.signals.slice(-300);
        if (state.currentPage === 'activity') appendSignalRow(signal);
      } catch(err) {}
    };
    state.ws.onclose = function() { setTimeout(connectWS, 3000); };
    state.ws.onerror = function() { try { state.ws.close(); } catch(e) {} };
  } catch(e) { console.error('WS connect', e); }
}

/* ================================================================
   Page: Home
   ================================================================ */
function renderHome() {
  var pendingActions = state.pending.filter(function(a) { return a.status === 'pending'; });
  var todayStart = new Date(); todayStart.setHours(0, 0, 0, 0);
  var todaySignals = state.signals.filter(function(s) { return new Date(s.timestamp) >= todayStart; }).length;
  var lastAnalysis = state.analysis.length > 0 ? state.analysis[state.analysis.length - 1] : null;

  // Collect key people from all goals for empty state messages
  var allKeyPeople = [];
  state.goals.forEach(function(g) {
    if (g.key_people) {
      g.key_people.forEach(function(p) {
        if (allKeyPeople.indexOf(p) === -1) allKeyPeople.push(p);
      });
    }
  });

  var html = '<div class="greeting">' + greeting() + ', David.' +
    '<span class="sub">Here\'s what\'s happening.</span></div>';

  // Proposed Goals - prominent cards
  if (state.proposed.length > 0) {
    html += '<div class="section">' +
      '<div class="section-title">Proposed Goals <span class="count">' + state.proposed.length + '</span></div>' +
      '<div class="proposed-card-grid">';
    state.proposed.forEach(function(pg) {
      var evidence = pg.evidence || [];
      html += '<div class="proposed-card">' +
        '<div class="proposed-name">' + esc(pg.name || 'Untitled') + '</div>' +
        '<div class="proposed-desc">' + esc(pg.description || '') + '</div>';
      if (evidence.length > 0) {
        html += '<div class="proposed-evidence">' +
          '<div class="proposed-evidence-title">Signals that triggered this</div>';
        evidence.forEach(function(ev) {
          html += '<div class="proposed-evidence-item">' + esc(ev) + '</div>';
        });
        html += '</div>';
      }
      html += '<div class="proposed-actions">' +
        '<button class="btn btn-primary btn-lg" onclick="acceptProposed(\'' + esc(pg.id) + '\', this)">Accept</button>' +
        '<button class="btn btn-dismiss btn-lg" onclick="dismissProposed(\'' + esc(pg.id) + '\', this)">Dismiss</button>' +
        '</div></div>';
    });
    html += '</div></div>';
  }

  // Recent Highlights
  if (lastAnalysis) {
    html += '<div class="section">' +
      '<div class="section-title">Recent Highlights</div>' +
      '<div class="card">';

    var matches = lastAnalysis.matches || lastAnalysis.goal_matches || [];
    if (matches.length > 0) {
      matches.slice(0, 8).forEach(function(m) {
        var goalIcon = m.goal_icon || '';
        var goalName = m.goal_name || m.goal || 'Unknown';
        var signalText = m.signal_text || m.signal_summary || m.signal || '';
        var reasoning = m.reasoning || m.explanation || '';
        html += '<div class="highlight-item">' +
          '<div class="highlight-goal">' + goalIcon + ' ' + esc(goalName) + '</div>' +
          (signalText ? '<div class="highlight-signal">' + esc(signalText) + '</div>' : '') +
          (reasoning ? '<div class="highlight-reasoning">' + esc(reasoning) + '</div>' : '') +
          '</div>';
      });
    }

    var facts = lastAnalysis.new_facts || lastAnalysis.facts || [];
    if (facts.length > 0) {
      html += '<div style="margin-top:12px;padding-top:12px;border-top:1px solid #21262d;">' +
        '<div style="font-weight:600;font-size:0.85rem;margin-bottom:8px;color:#3fb950;">New Facts</div>';
      facts.forEach(function(f) {
        var text = typeof f === 'string' ? f : (f.fact || f.text || JSON.stringify(f));
        html += '<div style="font-size:0.85rem;padding:3px 0;color:#c9d1d9;">&bull; ' + esc(text) + '</div>';
      });
      html += '</div>';
    }

    var commitments = lastAnalysis.commitments || [];
    if (commitments.length > 0) {
      html += '<div style="margin-top:12px;padding-top:12px;border-top:1px solid #21262d;">' +
        '<div style="font-weight:600;font-size:0.85rem;margin-bottom:8px;color:#d29922;">Commitments</div>';
      commitments.forEach(function(c) {
        var text = typeof c === 'string' ? c : (c.text || c.commitment || JSON.stringify(c));
        html += '<div style="font-size:0.85rem;padding:3px 0;color:#c9d1d9;">&bull; ' + esc(text) + '</div>';
      });
      html += '</div>';
    }

    if (matches.length === 0 && facts.length === 0 && commitments.length === 0) {
      html += '<div class="empty-state">No highlights from the last analysis cycle.</div>';
    }

    html += '</div></div>';
  }

  // Pending Actions
  if (pendingActions.length > 0) {
    html += '<div class="section">' +
      '<div class="section-title">Pending Actions <span class="count">' + pendingActions.length + '</span></div>';
    pendingActions.slice(0, 5).forEach(function(a) {
      var goalName = a.goal_name || a.goal || '';
      var sk = a.scope ? scopeKey(a.scope, a.scope_name) : '';
      var gn = goalName ? encodeURIComponent(goalName) : '';
      html += '<div class="card mb-8" style="display:flex;align-items:center;gap:12px;">' +
        '<span class="badge badge-purple">' + esc(a.type || 'action') + '</span>' +
        '<div style="flex:1;">' +
        (goalName ? '<span style="font-weight:600;">' + esc(goalName) + '</span> &mdash; ' : '') +
        '<span>' + esc(a.title || 'Untitled') + '</span>' +
        '<div style="font-size:0.82rem;color:#7d8590;margin-top:2px;">' + esc(a.description || '') + '</div>' +
        '</div>' +
        (sk && gn ? '<button class="btn btn-sm" onclick="location.hash=\'#goal/' + sk + '/' + gn + '\'">Review</button>' : '') +
        '</div>';
    });
    html += '</div>';
  }

  // Stats
  html += '<div class="card stats-bar">' +
    '<div class="stat"><div class="stat-value">' + todaySignals + '</div><div class="stat-label">Signals Today</div></div>' +
    '<div class="stat"><div class="stat-value">' + state.goals.length + '</div><div class="stat-label">Active Goals</div></div>' +
    '<div class="stat"><div class="stat-value">' + pendingActions.length + '</div><div class="stat-label">Pending Actions</div></div>' +
    '<div class="stat"><div class="stat-value">' + state.analysis.length + '</div><div class="stat-label">Analysis Cycles</div></div>' +
    '</div>';

  appEl.innerHTML = html;
}

/* ================================================================
   Page: Goals
   ================================================================ */
function renderGoals() {
  var html = '<div class="page-header">' +
    '<h1>Goals</h1>' +
    '<button class="btn btn-primary" onclick="openAddGoalModal()">+ Add Goal</button>' +
    '</div>';

  // Group by scope
  var grouped = {};
  state.goals.forEach(function(g) {
    var key = scopeKey(g.scope, g.scope_name);
    if (!grouped[key]) grouped[key] = { label: scopeLabel(g.scope, g.scope_name), goals: [] };
    grouped[key].goals.push(g);
  });

  // Count matches per goal from analysis
  var matchCounts = {};
  state.analysis.forEach(function(a) {
    var matches = a.matches || a.goal_matches || [];
    matches.forEach(function(m) {
      var gn = m.goal_name || m.goal || '';
      matchCounts[gn] = (matchCounts[gn] || 0) + 1;
    });
  });

  // Count pending per goal
  var pendingCounts = {};
  state.pending.filter(function(a) { return a.status === 'pending'; }).forEach(function(p) {
    var gn = p.goal_name || p.goal || '';
    pendingCounts[gn] = (pendingCounts[gn] || 0) + 1;
  });

  Object.keys(grouped).forEach(function(key) {
    var group = grouped[key];
    html += '<div class="scope-section">' +
      '<div class="scope-label">' + esc(group.label) + '</div>' +
      '<div class="goal-grid">';

    group.goals.forEach(function(g) {
      var mc = matchCounts[g.name] || 0;
      var pc = pendingCounts[g.name] || 0;
      var href = '#goal/' + key + '/' + encodeURIComponent(g.name);
      html += '<div class="card goal-card" onclick="location.hash=\'' + href + '\'">' +
        '<div class="goal-icon">' + (g.icon || '&#9898;') + '</div>' +
        '<div class="goal-name">' + esc(g.name) + '</div>' +
        '<div class="goal-desc">' + esc((g.description || '').split('\n')[0]) + '</div>' +
        '<div class="goal-meta">' +
        '<span>' + mc + ' signal' + (mc !== 1 ? 's' : '') + '</span>' +
        (pc > 0 ? '<span style="color:#d29922;">' + pc + ' pending</span>' : '') +
        '</div></div>';
    });
    html += '</div></div>';
  });

  if (state.goals.length === 0) {
    html += '<div class="empty-state">No goals yet. Create one to get started.</div>';
  }

  // Proposed goals
  if (state.proposed.length > 0) {
    html += '<div class="section mt-16">' +
      '<div class="section-title">Proposed Goals <span class="count">' + state.proposed.length + '</span></div>' +
      '<div class="proposed-card-grid">';
    state.proposed.forEach(function(pg) {
      var evidence = pg.evidence || [];
      html += '<div class="proposed-card">' +
        '<div class="proposed-name">' + esc(pg.name || 'Untitled') + '</div>' +
        '<div class="proposed-desc">' + esc(pg.description || '') + '</div>';
      if (evidence.length > 0) {
        html += '<div class="proposed-evidence">' +
          '<div class="proposed-evidence-title">Triggering signals</div>';
        evidence.forEach(function(ev) {
          html += '<div class="proposed-evidence-item">' + esc(ev) + '</div>';
        });
        html += '</div>';
      }
      html += '<div class="proposed-actions">' +
        '<button class="btn btn-primary btn-lg" onclick="acceptProposed(\'' + esc(pg.id) + '\', this)">Accept</button>' +
        '<button class="btn btn-dismiss btn-lg" onclick="dismissProposed(\'' + esc(pg.id) + '\', this)">Dismiss</button>' +
        '</div></div>';
    });
    html += '</div></div>';
  }

  appEl.innerHTML = html;
}

function openAddGoalModal() {
  var sel = document.getElementById('goalScope');
  sel.innerHTML = '';
  state.scopes.forEach(function(s) {
    var lbl = scopeLabel(s.type, s.name);
    var val = s.type + '|' + (s.name || '');
    sel.innerHTML += '<option value="' + esc(val) + '">' + esc(lbl) + '</option>';
  });
  document.getElementById('goalName').value = '';
  document.getElementById('goalDescription').value = '';
  document.getElementById('goalPeople').value = '';
  document.getElementById('goalIcon').value = '';
  openModal('addGoalModal');
}

async function createGoal() {
  var btn = document.getElementById('createGoalBtn');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>';
  try {
    var parts = document.getElementById('goalScope').value.split('|');
    var body = {
      scope: parts[0],
      scope_name: parts[1] || null,
      name: document.getElementById('goalName').value.trim(),
      description: document.getElementById('goalDescription').value.trim(),
      key_people: document.getElementById('goalPeople').value
        .split(',').map(function(s) { return s.trim(); }).filter(Boolean),
      icon: document.getElementById('goalIcon').value.trim(),
    };
    if (!body.name) { alert('Name is required'); btn.disabled = false; btn.textContent = 'Create'; return; }
    await api('/api/goals', { method: 'POST', body: JSON.stringify(body) });
    closeModal('addGoalModal');
    await loadGoals();
    renderCurrentPage();
  } catch(e) {
    alert('Failed: ' + e.message);
  } finally {
    btn.disabled = false;
    btn.textContent = 'Create';
  }
}

/* ================================================================
   Page: Goal Detail
   ================================================================ */
function normalizeGoalName(n) {
  return (n || '').toLowerCase().replace(/['']/g, '').replace(/\s+/g, ' ').trim();
}

function renderGoalDetail(scopeStr, name) {
  var goal = state.goals.find(function(g) {
    return scopeKey(g.scope, g.scope_name) === scopeStr && g.name === name;
  });

  var html = '<a href="#goals" class="back-link">&larr; Goals</a>';

  if (!goal) {
    html += '<div class="empty-state">Goal not found: ' + esc(name) + '</div>';
    appEl.innerHTML = html;
    return;
  }

  // Collect key people for empty state
  var keyPeopleNames = (goal.key_people || []).join(', ');

  // Header
  html += '<div class="detail-header">' +
    '<div class="detail-icon">' + (goal.icon || '&#9898;') + '</div>' +
    '<div style="flex:1;">' +
    '<div class="detail-name">' + esc(goal.name) + '</div>' +
    '<span class="badge badge-blue">' + esc(scopeLabel(goal.scope, goal.scope_name)) + '</span>' +
    (goal.status ? ' <span class="badge badge-green">' + esc(goal.status) + '</span>' : '') +
    '</div>' +
    '<button class="btn btn-sm" onclick="openEditGoalModal(\'' + esc(scopeStr) + '\', \'' + esc(goal.name).replace(/'/g, "\\'") + '\')">Edit</button>' +
    '</div>';

  // Description
  if (goal.description) {
    html += '<div class="detail-desc">' + esc(goal.description) + '</div>';
  }

  // Key People (with contact cards)
  if (goal.key_people && goal.key_people.length > 0) {
    html += '<div class="section"><div class="section-title">Key People</div>';
    goal.key_people.forEach(function(p) {
      var contact = findContactByName(p);
      if (contact) {
        html += renderContactCard(contact);
      } else {
        html += '<div class="contact-card">' +
          '<div class="contact-info">' +
          '<span class="contact-name">' + esc(p) + '</span>' +
          '</div>' +
          '<button class="btn btn-sm" onclick="openCreateContactFromName(\'' + esc(p).replace(/'/g, "\\'") + '\')">Create contact</button>' +
          '</div>';
      }
    });
    html += '</div>';
  }

  // Timeline - collect all matches for this goal across all analyses
  var allMatches = [];
  state.analysis.forEach(function(a) {
    var matches = a.matches || a.goal_matches || [];
    matches.forEach(function(m) {
      var gn = m.goal_name || m.goal || '';
      if (normalizeGoalName(gn) === normalizeGoalName(goal.name)) {
        allMatches.push(Object.assign({}, m, { analysis_ts: a.timestamp || a.ts }));
      }
    });
  });
  allMatches.sort(function(a, b) {
    var ta = a.signal_timestamp || a.analysis_ts || '';
    var tb = b.signal_timestamp || b.analysis_ts || '';
    return tb.localeCompare(ta);
  });

  html += '<div class="section">' +
    '<div class="section-title">Signal Timeline <span class="count">' + allMatches.length + '</span></div>';

  if (allMatches.length === 0) {
    html += '<div class="empty-state">' +
      'No signals matched yet. The monitor checks every 5 minutes.' +
      (keyPeopleNames ? '<div class="empty-hint">Signals from ' + esc(keyPeopleNames) + ' will match automatically.</div>' : '') +
      '</div>';
  } else {
    allMatches.forEach(function(m) {
      var ts = m.signal_timestamp || m.analysis_ts || '';
      var conf = m.confidence || '';
      var source = m.signal_source || m.source || '';
      var signalText = m.signal_text || m.signal_summary || m.signal || '';
      var reasoning = m.reasoning || m.explanation || '';
      var action = m.suggested_action || m.action || '';
      var confUpper = (conf || '').toUpperCase();
      var borderColor = confUpper === 'HIGH' ? '#3fb950' : confUpper === 'MEDIUM' ? '#d29922' : '#30363d';

      html += '<div class="timeline-item" style="border-left-color:' + borderColor + ';">' +
        '<div class="timeline-meta">' +
        '<span class="timeline-time">' + fmtTimeFull(ts) + '</span>' +
        (source ? ' <span class="' + sourceBadgeClass(source) + '">' + esc(source) + '</span>' : '') +
        (conf ? ' <span class="' + confBadgeClass(conf) + '">' + esc(confUpper) + '</span>' : '') +
        '</div>' +
        (signalText ? '<div class="timeline-signal">' + esc(signalText) + '</div>' : '') +
        (reasoning ? '<div class="timeline-reasoning">' + esc(reasoning) + '</div>' : '') +
        (action ? '<div class="timeline-action">Suggested: ' + esc(action) + '</div>' : '') +
        '</div>';
    });
  }
  html += '</div>';

  // Next Actions
  var scopeActions = state.actions.find(function(a) {
    return a.scope === goal.scope && (a.scope_name || null) === (goal.scope_name || null);
  });
  if (scopeActions && scopeActions.content && scopeActions.content.trim()) {
    // Filter actions to those relevant to this goal
    var allActionLines = scopeActions.content.trim().split('\n');
    var filteredActions = [];
    var hasHeadings = allActionLines.some(function(l) { return /^##\s/.test(l.trim()); });

    if (hasHeadings) {
      // Structured format: only show lines under matching ## heading
      var inMatchingSection = false;
      allActionLines.forEach(function(l) {
        var trimmed = l.trim();
        if (/^##\s/.test(trimmed)) {
          var heading = trimmed.replace(/^##\s+/, '');
          inMatchingSection = normalizeGoalName(heading) === normalizeGoalName(goal.name);
        } else if (/^#\s/.test(trimmed)) {
          inMatchingSection = false;
        } else if (inMatchingSection && trimmed) {
          filteredActions.push(l);
        }
      });
    } else {
      // Flat list: filter by keyword matching against goal name and key people
      var actionSearchTerms = [goal.name.toLowerCase()];
      (goal.key_people || []).forEach(function(p) {
        var parts = p.split(/[\s—\-(]+/);
        if (parts[0] && parts[0].length > 2) actionSearchTerms.push(parts[0].toLowerCase());
        actionSearchTerms.push(p.toLowerCase().split('—')[0].split('(')[0].trim());
      });
      allActionLines.forEach(function(l) {
        var trimmed = l.trim();
        if (!trimmed || /^#/.test(trimmed)) return;
        var lower = l.toLowerCase();
        if (actionSearchTerms.some(function(term) { return lower.indexOf(term) >= 0; })) {
          filteredActions.push(l);
        }
      });
    }

    if (filteredActions.length > 0) {
      html += '<div class="section">' +
        '<div class="section-title">Next Actions</div>' +
        '<div class="card">';
      filteredActions.forEach(function(line) {
        var text = line.replace(/^[\-\*\s]+/, '').replace(/^\[.\]\s*/, '');
        var checked = /^\s*\[x\]/i.test(line);
        html += '<div class="action-item">' +
          '<div class="action-checkbox" style="' + (checked ? 'background:#238636;border-color:#238636;' : '') + '"></div>' +
          '<span>' + esc(text) + '</span></div>';
      });
      html += '</div></div>';
    }
  }

  // Memory — filtered to entries relevant to this goal
  var scopeMemory = state.memory.find(function(m) {
    return m.scope === goal.scope && (m.scope_name || null) === (goal.scope_name || null);
  });
  if (scopeMemory && scopeMemory.content && scopeMemory.content.trim()) {
    // Build search terms from goal name, description, and key people
    var searchTerms = [goal.name.toLowerCase()];
    if (goal.description) {
      // Extract key words from description (skip common words)
      goal.description.toLowerCase().split(/\s+/).forEach(function(w) {
        if (w.length > 4 && ['about','which','their','there','these','those','would','should','could','based','always','before','every','ensure'].indexOf(w) < 0) {
          searchTerms.push(w);
        }
      });
    }
    (goal.key_people || []).forEach(function(p) {
      // Extract first name and full name
      var parts = p.split(/[\s—\-(]+/);
      if (parts[0] && parts[0].length > 2) searchTerms.push(parts[0].toLowerCase());
      searchTerms.push(p.toLowerCase().split('—')[0].split('(')[0].trim());
    });

    var memLines = scopeMemory.content.trim().split('\n').filter(function(l) {
      if (!l.trim() || l.startsWith('#')) return false;
      var lower = l.toLowerCase();
      return searchTerms.some(function(term) { return lower.indexOf(term) >= 0; });
    });
    html += '<div class="section">' +
      '<div class="section-title">Memory</div>' +
      '<div class="card">' +
      '<ul class="memory-list" id="memoryList">';
    var displayCount = Math.min(memLines.length, 8);
    for (var i = 0; i < displayCount; i++) {
      html += '<li>' + esc(memLines[i].replace(/^[\-\*\s]+/, '')) + '</li>';
    }
    html += '</ul>';
    if (memLines.length > 8) {
      html += '<button class="collapsible-toggle mt-8" onclick="expandMemory(this)" ' +
        'data-full="' + esc(JSON.stringify(memLines)) + '">Show ' + (memLines.length - 8) + ' more...</button>';
    }
    html += '</div></div>';
  }

  // Pending Actions for this goal
  var goalPending = state.pending.filter(function(p) {
    return p.status === 'pending' && (normalizeGoalName(p.goal_name) === normalizeGoalName(goal.name) || normalizeGoalName(p.goal) === normalizeGoalName(goal.name));
  });
  if (goalPending.length > 0) {
    html += '<div class="section">' +
      '<div class="section-title">Agent Work <span class="count">' + goalPending.length + '</span></div>';
    goalPending.forEach(function(p) {
      html += '<div class="card pending-item mb-8">' +
        '<div style="display:flex;align-items:center;gap:8px;margin-bottom:8px;">' +
        '<span class="badge badge-purple">' + esc(p.type || 'action') + '</span>' +
        '<span class="pending-title">' + esc(p.title || 'Untitled') + '</span>' +
        '</div>' +
        '<div class="pending-desc">' + esc(p.description || '') + '</div>' +
        (p.content ? '<div class="pending-content-preview" onclick="this.classList.toggle(\'expanded\')">' + esc(p.content) + '</div>' : '') +
        '<div class="pending-actions">' +
        '<button class="btn btn-primary btn-sm" onclick="approvePending(\'' + esc(p.id) + '\', this)">Approve</button>' +
        '<button class="btn btn-sm" onclick="editPending(\'' + esc(p.id) + '\')">Edit</button>' +
        '<button class="btn btn-sm" onclick="dismissPending(\'' + esc(p.id) + '\', this)">Dismiss</button>' +
        '</div></div>';
    });
    html += '<button class="btn btn-accent mt-8" onclick="runAgents(this)">Run Agent Now</button>';
    html += '</div>';
  } else {
    html += '<div class="section">' +
      '<button class="btn btn-accent" onclick="runAgents(this)">Run Agent Now</button>' +
      '</div>';
  }

  appEl.innerHTML = html;
}

function expandMemory(btn) {
  try {
    var lines = JSON.parse(btn.dataset.full);
    var list = btn.previousElementSibling;
    list.innerHTML = lines.map(function(l) {
      return '<li>' + esc(l.replace(/^[\-\*\s]+/, '')) + '</li>';
    }).join('');
    btn.remove();
  } catch(e) {}
}

async function approvePending(id, btn) {
  var action = state.pending.find(function(p) { return p.id === id; });
  if (!action) return;

  var type = action.type || '';
  if (type === 'draft_email' || type === 'draft_message') {
    var recipient = action.recipient || 'unknown';
    var content = action.content || action.description || '';
    var ok = confirm(
      'Send this ' + type.replace('draft_', '') + ' to ' + recipient + '?\n\n' +
      content.slice(0, 500)
    );
    if (!ok) return;
  }

  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>';
  try {
    await api('/api/pending/' + id + '/approve', { method: 'POST' });
    await loadPending();
    renderCurrentPage();
  } catch(e) {
    alert('Failed: ' + e.message);
    btn.disabled = false;
    btn.textContent = 'Approve';
  }
}

async function dismissPending(id, btn) {
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>';
  try {
    await api('/api/pending/' + id + '/dismiss', { method: 'POST' });
    await loadPending();
    renderCurrentPage();
  } catch(e) {
    alert('Failed: ' + e.message);
    btn.disabled = false;
    btn.textContent = 'Dismiss';
  }
}

function editPending(id) {
  var item = state.pending.find(function(p) { return p.id === id; });
  if (!item) return;
  state.editingPendingId = id;
  document.getElementById('editPendingContent').value = item.content || '';
  openModal('editPendingModal');
}

async function savePendingEdit() {
  var btn = document.getElementById('savePendingBtn');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>';
  try {
    var content = document.getElementById('editPendingContent').value;
    await api('/api/pending/' + state.editingPendingId + '/edit', {
      method: 'POST',
      body: JSON.stringify({ content: content }),
    });
    closeModal('editPendingModal');
    await loadPending();
    renderCurrentPage();
  } catch(e) {
    alert('Failed: ' + e.message);
  } finally {
    btn.disabled = false;
    btn.textContent = 'Save';
  }
}

async function runAgents(btn) {
  btn.disabled = true;
  var orig = btn.innerHTML;
  btn.innerHTML = '<span class="spinner"></span> Running...';
  try {
    var res = await api('/api/agents/run', { method: 'POST' });
    btn.innerHTML = 'Done (' + (res.actions_produced || 0) + ' actions)';
    await loadPending();
    setTimeout(renderCurrentPage, 1500);
  } catch(e) {
    alert('Failed: ' + e.message);
    btn.disabled = false;
    btn.innerHTML = orig;
  }
}

   Page: Chat

function renderChat() {

    '<div class="chat-messages" id="chatMessages"></div>' +
    '<div class="chat-input-bar">' +
    '<textarea class="chat-textarea" id="chatInput" ' +
    'placeholder="Ask me anything..." rows="1" ' +

function renderChatMessages() {
  var container = document.getElementById('chatMessages');
  if (!container) return;

  if (state.conversation.length === 0) {
    container.innerHTML = '<div class="chat-welcome">' +
      '<h2>Hi David</h2>' +
      '<p>I\'m your productivity agent. I can see your goals, monitor your desktop, and help you get things done. Ask me anything.</p>' +
      '</div>';
    return;
  }

  var html = '';
  state.conversation.forEach(function(msg) {
    var isUser = msg.role === 'user';
    var isProactive = msg.proactive;
    var cls = isUser ? 'msg msg-user' : (isProactive ? 'msg msg-proactive' : 'msg msg-agent');
    var content = isUser ? '<p>' + esc(msg.content) + '</p>' : renderMarkdown(msg.content || '');
    var prefix = isProactive ? '<span style="color:#d29922;">&#128276;</span> ' : '';

    html += '<div class="' + cls + '">' +
      '<div class="msg-content">' + prefix + content + '</div>' +
      '<div class="msg-time">' + fmtTime(msg.timestamp) + '</div>' +
      '</div>';
  });

  if (state.chatSending) {
    html += '<div class="thinking">Thinking<span class="thinking-dots"></span></div>';
  }

  container.innerHTML = html;
  container.scrollTop = container.scrollHeight;
}

function autoGrow(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 120) + 'px';
}

function handleChatKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendChat();
  }
}

async function sendChat() {
  var input = document.getElementById('chatInput');
  var msg = input.value.trim();
  if (!msg || state.chatSending) return;

  input.value = '';
  input.style.height = 'auto';
  state.chatSending = true;

  // Optimistic add
  state.conversation.push({
    role: 'user',
    content: msg,
    timestamp: new Date().toISOString(),
  });
  state.conversationKnownLen = state.conversation.length;
  renderChatMessages();

  try {
    var res = await api('/api/chat', {
      method: 'POST',
      body: JSON.stringify({ message: msg }),
    });
    state.conversation.push({
      role: 'agent',
      content: res.response,
      timestamp: new Date().toISOString(),
    });
    state.conversationKnownLen = state.conversation.length;
  } catch(e) {
    state.conversation.push({
      role: 'agent',
      content: 'Sorry, I encountered an error. Please try again.',
      timestamp: new Date().toISOString(),
    });
  }
  state.chatSending = false;
  renderChatMessages();
  setTimeout(function() {
    var input = document.getElementById('chatInput');
    if (input) input.focus();
  }, 50);
}

/* ================================================================
   Page: Activity
   ================================================================ */
function renderActivity() {
  var html = '<div class="page-header"><h1>Activity</h1></div>';

  // Filters
  html += '<div class="activity-filters">' +
    '<select id="sourceFilter" onchange="filterSignals()">' +
    '<option value="">All Sources</option>';
  state.signalSources.forEach(function(s) {
    html += '<option value="' + esc(s) + '">' + esc(s) + '</option>';
  });
  html += '</select>' +
    '<input type="text" id="searchFilter" placeholder="Search signals..." onkeyup="debounceFilter()">' +
    '</div>';

  // Signal table - full text, no truncation
  html += '<div class="section">' +
    '<div class="section-title">Live Signal Feed <span class="count">' + state.signals.length + '</span></div>' +
    '<div class="card signal-table-wrap">' +
    '<table class="signal-table">' +
    '<thead><tr>' +
    '<th class="col-time">Time</th><th class="col-source">Source</th><th class="col-sender">Sender</th><th class="col-signal">Signal</th>' +
    '</tr></thead>' +
    '<tbody id="signalTableBody">';

  var reversed = state.signals.slice().reverse().slice(0, 100);
  reversed.forEach(function(s) {
    html += signalRowHtml(s);
  });
  html += '</tbody></table></div></div>';

  // Analysis history
  html += '<div class="section">' +
    '<div class="section-title">Analysis History <span class="count">' + state.analysis.length + '</span></div>';

  var reversedA = state.analysis.slice().reverse();
  reversedA.forEach(function(a) {
    var matches = a.matches || a.goal_matches || [];
    var facts = a.new_facts || a.facts || [];
    var skipped = a.skipped_count || a.skipped || 0;
    html += '<div class="card analysis-entry mb-8" onclick="this.classList.toggle(\'expanded\')">' +
      '<div class="analysis-summary">' +
      '<span class="timeline-time">' + fmtTime(a.timestamp || a.ts) + '</span>' +
      '<span class="badge badge-blue">' + matches.length + ' matches</span>' +
      (skipped ? '<span class="badge badge-gray">' + skipped + ' skipped</span>' : '') +
      (facts.length ? '<span class="badge badge-green">' + facts.length + ' facts</span>' : '') +
      '</div>' +
      '<div class="analysis-detail">';

    matches.forEach(function(m) {
      var gn = m.goal_name || m.goal || '';
      var st = m.signal_text || m.signal_summary || m.signal || '';
      var re = m.reasoning || m.explanation || '';
      html += '<div style="padding:6px 0;border-bottom:1px solid #21262d;">' +
        '<strong>' + esc(gn) + '</strong>' +
        (st ? '<div class="highlight-signal">' + esc(st) + '</div>' : '') +
        (re ? '<div class="highlight-reasoning">' + esc(re) + '</div>' : '') +
        '</div>';
    });
    facts.forEach(function(f) {
      var text = typeof f === 'string' ? f : (f.fact || f.text || JSON.stringify(f));
      html += '<div style="font-size:0.82rem;color:#3fb950;padding:3px 0;">&bull; ' + esc(text) + '</div>';
    });
    if (matches.length === 0 && facts.length === 0) {
      html += '<div style="color:#7d8590;font-size:0.85rem;">No matches or facts in this cycle.</div>';
    }
    html += '</div></div>';
  });

  if (state.analysis.length === 0) {
    html += '<div class="empty-state">No analysis cycles yet.</div>';
  }

  html += '</div>';

  appEl.innerHTML = html;
}

/* Signal row: always show full text, no expand/collapse needed */
function signalRowHtml(s) {
  var text = esc(s.text || '');
  return '<tr>' +
    '<td class="col-time"><span class="timeline-time">' + fmtTime(s.timestamp) + '</span></td>' +
    '<td class="col-source"><span class="' + sourceBadgeClass(s.source) + '">' + esc(s.source || '') + '</span></td>' +
    '<td class="col-sender">' + esc(s.sender || '') + '</td>' +
    '<td class="signal-text">' + text + '</td>' +
    '</tr>';
}

function appendSignalRow(signal) {
  var tbody = document.getElementById('signalTableBody');
  if (!tbody) return;
  var tr = document.createElement('tr');
  var text = esc(signal.text || '');
  tr.innerHTML =
    '<td class="col-time"><span class="timeline-time">' + fmtTime(signal.timestamp) + '</span></td>' +
    '<td class="col-source"><span class="' + sourceBadgeClass(signal.source) + '">' + esc(signal.source || '') + '</span></td>' +
    '<td class="col-sender">' + esc(signal.sender || '') + '</td>' +
    '<td class="signal-text">' + text + '</td>';
  tbody.insertBefore(tr, tbody.firstChild);
  // Trim table
  while (tbody.children.length > 150) tbody.removeChild(tbody.lastChild);
  // Update count
  var countEl = document.querySelector('.section-title .count');
  if (countEl) countEl.textContent = state.signals.length;
}

var filterTimer = null;
function debounceFilter() {
  clearTimeout(filterTimer);
  filterTimer = setTimeout(filterSignals, 300);
}

async function filterSignals() {
  var source = document.getElementById('sourceFilter') ? document.getElementById('sourceFilter').value : '';
  var search = document.getElementById('searchFilter') ? document.getElementById('searchFilter').value : '';
  await loadSignals({ source: source, search: search });
  var tbody = document.getElementById('signalTableBody');
  if (!tbody) return;
  var reversed = state.signals.slice().reverse().slice(0, 100);
  tbody.innerHTML = reversed.map(signalRowHtml).join('');
  // Update count
  var countEl = document.querySelector('.section-title .count');
  if (countEl) countEl.textContent = state.signals.length;
}

/* ================================================================

   ================================================================ */
function openEditGoalModal(scopeStr, goalName) {
  var goal = state.goals.find(function(g) {
    return scopeKey(g.scope, g.scope_name) === scopeStr && g.name === goalName;
  });
  if (!goal) return;
  document.getElementById('editGoalOrigName').value = goal.name;
  document.getElementById('editGoalScope').value = goal.scope;
  document.getElementById('editGoalScopeName').value = goal.scope_name || '';
  document.getElementById('editGoalName').value = goal.name;
  document.getElementById('editGoalDescription').value = goal.description || '';
  document.getElementById('editGoalPeople').value = (goal.key_people || []).join('\n');
  document.getElementById('editGoalIcon').value = goal.icon || '';
  openModal('editGoalModal');
}

async function saveGoalEdit() {
  var btn = document.getElementById('saveGoalBtn');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>';
  try {
    var origName = document.getElementById('editGoalOrigName').value;
    var scope = document.getElementById('editGoalScope').value;
    var scopeName = document.getElementById('editGoalScopeName').value || null;
    var newName = document.getElementById('editGoalName').value.trim();
    var description = document.getElementById('editGoalDescription').value.trim();
    var people = document.getElementById('editGoalPeople').value
      .split('\n').map(function(s) { return s.trim(); }).filter(Boolean);
    var icon = document.getElementById('editGoalIcon').value.trim();

    if (!newName) { alert('Name is required'); btn.disabled = false; btn.textContent = 'Save'; return; }

    // If name changed, delete old goal first
    if (origName !== newName) {
      await api('/api/goals', {
        method: 'DELETE',
        body: JSON.stringify({ scope: scope, scope_name: scopeName, name: origName }),
      });
    }

    // Upsert with new data
    await api('/api/goals', {
      method: 'POST',
      body: JSON.stringify({
        scope: scope,
        scope_name: scopeName,
        name: newName,
        description: description,
        key_people: people,
        icon: icon,
      }),
    });
    closeModal('editGoalModal');
    await loadGoals();
    // Navigate to updated goal
    var sk = scopeName ? scope + '/' + scopeName : scope;
    location.hash = '#goal/' + sk + '/' + encodeURIComponent(newName);
  } catch(e) {
    alert('Failed: ' + e.message);
  } finally {
    btn.disabled = false;
    btn.textContent = 'Save';
  }
}

async function deleteGoal() {
  var name = document.getElementById('editGoalOrigName').value;
  if (!confirm('Delete goal "' + name + '"? This cannot be undone.')) return;
  try {
    var scope = document.getElementById('editGoalScope').value;
    var scopeName = document.getElementById('editGoalScopeName').value || null;
    await api('/api/goals', {
      method: 'DELETE',
      body: JSON.stringify({ scope: scope, scope_name: scopeName, name: name }),
    });
    closeModal('editGoalModal');
    await loadGoals();
    location.hash = '#goals';
  } catch(e) {
    alert('Failed: ' + e.message);
  }
}

/* ================================================================
   Contacts
   ================================================================ */
function findContactByName(personStr) {
  if (!personStr) return null;
  var lower = personStr.toLowerCase();
  return state.contacts.find(function(c) {
    if (c.name && c.name.toLowerCase() === lower) return true;
    if (c.nickname && c.nickname.toLowerCase() === lower) return true;
    if (c.name && lower.indexOf(c.name.toLowerCase()) !== -1) return true;
    if (c.nickname && lower.indexOf(c.nickname.toLowerCase()) !== -1) return true;
    var firstName = (c.name || '').split(' ')[0].toLowerCase();
    if (firstName && firstName === lower) return true;
    return false;
  });
}

function renderContactCard(contact) {
  var nickname = contact.nickname ? ' (' + esc(contact.nickname) + ')' : '';
  var phone = contact.phone ? '<a href="tel:' + esc(contact.phone) + '">' + esc(contact.phone) + '</a>' : '';
  var email = contact.email ? '<a href="mailto:' + esc(contact.email) + '">' + esc(contact.email) + '</a>' : '';
  var links = '';
  if (phone || email) {
    links = '<div class="contact-links">' + phone + (phone && email ? ' &bull; ' : '') + email + '</div>';
  }
  var goals = '';
  if (contact.goals && contact.goals.length > 0) {
    goals = '<div class="contact-goals-list">';
    contact.goals.forEach(function(g) {
      goals += '<span class="contact-goal-tag">' + esc(g) + '</span>';
    });
    goals += '</div>';
  }
  return '<div class="contact-card">' +
    '<div class="contact-info">' +
    '<span class="contact-name">' + esc(contact.name) + nickname + '</span>' +
    (contact.relationship ? '<span class="contact-relationship">' + esc(contact.relationship) + '</span>' : '') +
    links + goals +
    '</div>' +
    '<div class="contact-actions-col">' +
    '<button class="btn btn-sm" onclick="openEditContact(\'' + esc(contact.id) + '\')">Edit</button>' +
    '</div>' +
    '</div>';
}

function renderContacts() {
  var html = '<div class="page-header">' +
    '<h1>Contacts</h1>' +
    '<button class="btn btn-primary" onclick="openNewContactModal()">+ Add Contact</button>' +
    '</div>';

  if (state.contacts.length === 0) {
    html += '<div class="empty-state">No contacts yet. Add contacts to track key people across your goals.</div>';
  } else {
    html += '<div class="contacts-grid">';
    state.contacts.forEach(function(c) {
      html += renderContactCard(c);
    });
    html += '</div>';
  }

  appEl.innerHTML = html;
}

async function saveContact() {
  var btn = document.getElementById('saveContactBtn');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>';
  try {
    var id = document.getElementById('contactId').value;
    var name = document.getElementById('contactName').value.trim();
    if (!name) { alert('Name is required'); btn.disabled = false; btn.textContent = 'Save'; return; }
    var body = {
      name: name,
      nickname: document.getElementById('contactNickname').value.trim() || null,
      relationship: document.getElementById('contactRelationship').value.trim() || null,
      phone: document.getElementById('contactPhone').value.trim() || null,
      email: document.getElementById('contactEmail').value.trim() || null,
      goals: document.getElementById('contactGoals').value
        .split(',').map(function(s) { return s.trim(); }).filter(Boolean),
    };
    if (id) body.id = id;
    var channels = {};
    if (body.phone) channels.imessage = body.phone;
    if (body.email) channels.email = body.email;
    body.channels = channels;

    await api('/api/contacts', { method: 'POST', body: JSON.stringify(body) });
    closeModal('contactModal');
    await loadContacts();
    renderCurrentPage();
  } catch(e) {
    alert('Failed: ' + e.message);
  } finally {
    btn.disabled = false;
    btn.textContent = 'Save';
  }
}

async function deleteContact(id) {
  if (!confirm('Delete this contact?')) return;
  try {
    await api('/api/contacts/' + id, { method: 'DELETE' });
    await loadContacts();
    renderCurrentPage();
  } catch(e) {
    alert('Failed: ' + e.message);
  }
}

/* ================================================================
   Persistent Chat Bar & Panel
   ================================================================ */
function openChatPanel() {
  state.chatPanelOpen = true;
  document.getElementById('chat-panel').classList.add('open');
  renderChatPanelMessages();
}

function closeChatPanel() {
  state.chatPanelOpen = false;
  document.getElementById('chat-panel').classList.remove('open');
}

function renderChatPanelMessages() {
  var container = document.getElementById('chat-panel-messages');
  if (!container) return;
  if (state.conversation.length === 0) {
    container.innerHTML = '<div class="chat-welcome" style="padding:30px 20px;">' +
      '<h2>Hi David</h2>' +
      '<p>Ask me anything about your goals, schedule, or tasks.</p>' +
      '</div>';
    return;
  }
  var html = '';
  state.conversation.forEach(function(msg) {
    var isUser = msg.role === 'user';
    var isProactive = msg.proactive;
    var cls = isUser ? 'msg msg-user' : (isProactive ? 'msg msg-proactive' : 'msg msg-agent');
    var content = isUser ? '<p>' + esc(msg.content) + '</p>' : renderMarkdown(msg.content || '');
    var prefix = isProactive ? '<span style="color:#d29922;">&#128276;</span> ' : '';
    html += '<div class="' + cls + '">' +
      '<div class="msg-content">' + prefix + content + '</div>' +
      '<div class="msg-time">' + fmtTime(msg.timestamp) + '</div>' +
      '</div>';
  });
  if (state.chatSending) {
    html += '<div class="thinking">Thinking<span class="thinking-dots"></span></div>';
  }
  container.innerHTML = html;
  container.scrollTop = container.scrollHeight;
}

async function sendBarChat() {
  var input = document.getElementById('chat-bar-input');
  if (!input) return;
  var msg = input.value.trim();
  if (!msg || state.chatSending) return;

  input.value = '';
  state.chatSending = true;

  // Open panel if not open
  if (!state.chatPanelOpen) openChatPanel();

  // Optimistic add
  state.conversation.push({
    role: 'user',
    content: msg,
    timestamp: new Date().toISOString(),
  });
  state.conversationKnownLen = state.conversation.length;
  renderChatPanelMessages();
  if (state.currentPage === 'chat') renderChatMessages();

  try {
    var res = await api('/api/chat', {
      method: 'POST',
      body: JSON.stringify({ message: msg }),
    });
    state.conversation.push({
      role: 'agent',
      content: res.response,
      timestamp: new Date().toISOString(),
    });
    state.conversationKnownLen = state.conversation.length;
  } catch(e) {
    state.conversation.push({
      role: 'agent',
      content: 'Sorry, I encountered an error. Please try again.',
      timestamp: new Date().toISOString(),
    });
  }
  state.chatSending = false;
  renderChatPanelMessages();
  if (state.currentPage === 'chat') renderChatMessages();
}

document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') {
    document.querySelectorAll('.modal-overlay.open').forEach(function(m) {
      m.classList.remove('open');
    });
    if (state.chatPanelOpen) closeChatPanel();
  }
});

// Close modal on overlay click
document.querySelectorAll('.modal-overlay').forEach(function(overlay) {
  overlay.addEventListener('click', function(e) {
    if (e.target === overlay) overlay.classList.remove('open');
  });
});

// Close chat panel when clicking outside
document.addEventListener('click', function(e) {
  if (!state.chatPanelOpen) return;
  var panel = document.getElementById('chat-panel');
  var bar = document.getElementById('chat-bar');
  if (panel && bar && !panel.contains(e.target) && !bar.contains(e.target)) {
    closeChatPanel();
  }
});
