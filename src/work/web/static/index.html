<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>work</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #0d1117;
  --panel: #161b22;
  --border: #30363d;
  --text: #e6edf3;
  --muted: #7d8590;
  --accent: #58a6ff;
  --green: #3fb950;
  --yellow: #d29922;
  --red: #f85149;
  --amber: #e3b341;
}

html, body {
  height: 100%;
  background: var(--bg);
  color: var(--text);
  font-family: 'Inter', -apple-system, sans-serif;
  font-size: 13px;
  line-height: 1.5;
  overflow: hidden;
}

/* ---- Top Bar ---- */
.topbar {
  height: 48px;
  background: var(--panel);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  padding: 0 16px;
  gap: 20px;
  flex-shrink: 0;
}
.topbar-logo {
  font-family: 'JetBrains Mono', monospace;
  font-weight: 700;
  font-size: 16px;
  color: var(--accent);
}
.topbar-status {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 12px;
  color: var(--muted);
}
.status-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--green);
}
.status-dot.stopped { background: var(--red); }
.topbar-user {
  margin-left: auto;
  font-size: 12px;
  color: var(--muted);
}

/* ---- Main Layout ---- */
.main-layout {
  display: flex;
  height: calc(100% - 48px);
}

/* ---- Sidebars ---- */
.sidebar-left {
  width: 250px;
  min-width: 250px;
  background: var(--panel);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  overflow-y: auto;
}
.sidebar-right {
  width: 300px;
  min-width: 300px;
  background: var(--panel);
  border-left: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* ---- Collapsible Sections ---- */
.section-header {
  display: flex;
  align-items: center;
  padding: 10px 12px;
  cursor: pointer;
  user-select: none;
  border-bottom: 1px solid var(--border);
  gap: 8px;
  font-weight: 600;
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  color: var(--muted);
}
.section-header:hover { color: var(--text); }
.section-chevron {
  font-size: 10px;
  transition: transform 0.15s;
}
.section-header.collapsed .section-chevron { transform: rotate(-90deg); }
.section-badge {
  margin-left: auto;
  background: var(--accent);
  color: #fff;
  font-size: 10px;
  font-weight: 600;
  padding: 1px 6px;
  border-radius: 10px;
  min-width: 18px;
  text-align: center;
}
.section-body {
  overflow: hidden;
  transition: max-height 0.2s ease;
}
.section-header.collapsed + .section-body { max-height: 0 !important; }

/* ---- Goals ---- */
.goal-item {
  display: flex;
  align-items: center;
  padding: 8px 12px;
  gap: 8px;
  cursor: pointer;
  border-bottom: 1px solid var(--border);
  font-size: 12px;
}
.goal-item:hover { background: rgba(88,166,255,0.06); }
.goal-icon { font-size: 14px; }
.goal-name { flex: 1; }
.goal-scope {
  font-size: 10px;
  padding: 1px 6px;
  border-radius: 8px;
  background: rgba(88,166,255,0.15);
  color: var(--accent);
  font-weight: 500;
}
.goal-item.proposed {
  border-left: 3px solid var(--amber);
}
.goal-actions {
  display: flex;
  gap: 4px;
}
.goal-actions button {
  font-size: 10px;
  padding: 2px 8px;
  border: none;
  border-radius: 4px;
  cursor: pointer;
  font-weight: 500;
}
.btn-accept { background: var(--green); color: #fff; }
.btn-reject { background: var(--red); color: #fff; }
.btn-add-goal {
  width: 100%;
  padding: 8px;
  background: none;
  border: 1px dashed var(--border);
  color: var(--muted);
  cursor: pointer;
  font-size: 12px;
  font-family: inherit;
}
.btn-add-goal:hover { color: var(--accent); border-color: var(--accent); }

/* ---- Memory ---- */
.memory-item {
  padding: 8px 12px;
  border-bottom: 1px solid var(--border);
  font-size: 11px;
  color: var(--muted);
  cursor: pointer;
}
.memory-item:hover { color: var(--text); }
.memory-scope {
  font-size: 10px;
  font-weight: 600;
  text-transform: uppercase;
  color: var(--accent);
  margin-bottom: 2px;
}
.memory-text {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.memory-text.expanded {
  white-space: normal;
}

/* ---- Actions list (left sidebar) ---- */
.action-item {
  padding: 8px 12px;
  border-bottom: 1px solid var(--border);
  font-size: 12px;
}
.action-item-type {
  font-size: 10px;
  font-weight: 600;
  text-transform: uppercase;
  color: var(--yellow);
  margin-bottom: 2px;
}
.action-item-title {
  color: var(--text);
}

/* ---- Center (Conversation) ---- */
.center-panel {
  flex: 1;
  display: flex;
  flex-direction: column;
  min-width: 0;
}
.conversation {
  flex: 1;
  overflow-y: auto;
  padding: 16px 24px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

/* Messages */
.msg {
  max-width: 75%;
  padding: 10px 14px;
  border-radius: 12px;
  font-size: 13px;
  line-height: 1.55;
  word-wrap: break-word;
}
.msg-user {
  align-self: flex-end;
  background: var(--accent);
  color: #fff;
  border-bottom-right-radius: 4px;
}
.msg-agent {
  align-self: flex-start;
  background: var(--panel);
  border: 1px solid var(--border);
  border-bottom-left-radius: 4px;
}
.msg-proactive {
  align-self: flex-start;
  background: var(--panel);
  border: 1px solid var(--border);
  border-left: 3px solid var(--amber);
  border-bottom-left-radius: 4px;
}
.msg-proactive .proactive-icon {
  margin-right: 4px;
}
.msg-time {
  font-size: 10px;
  color: var(--muted);
  margin-top: 4px;
}
.msg-user .msg-time { color: rgba(255,255,255,0.6); }

/* Markdown inside messages */
.msg h3 { font-size: 14px; margin: 8px 0 4px; }
.msg h4 { font-size: 13px; margin: 6px 0 3px; }
.msg strong { font-weight: 600; }
.msg em { font-style: italic; }
.msg ul { margin: 4px 0 4px 16px; }
.msg li { margin: 2px 0; }
.msg code {
  font-family: 'JetBrains Mono', monospace;
  background: rgba(255,255,255,0.08);
  padding: 1px 5px;
  border-radius: 3px;
  font-size: 12px;
}
.msg pre {
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 10px;
  margin: 6px 0;
  overflow-x: auto;
}
.msg pre code {
  background: none;
  padding: 0;
  font-size: 12px;
}
.msg a { color: var(--accent); text-decoration: none; }
.msg a:hover { text-decoration: underline; }

/* Action cards inside messages */
.action-card {
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 12px;
  margin: 8px 0;
}
.action-card-title {
  font-weight: 600;
  font-size: 13px;
  margin-bottom: 6px;
}
.action-card-content {
  font-size: 12px;
  color: var(--muted);
  margin-bottom: 8px;
  white-space: pre-wrap;
}
.action-card-buttons {
  display: flex;
  gap: 6px;
}
.action-card-buttons button {
  font-size: 11px;
  padding: 4px 12px;
  border: none;
  border-radius: 4px;
  cursor: pointer;
  font-weight: 500;
  font-family: inherit;
}
.btn-green { background: var(--green); color: #fff; }
.btn-green:hover { background: #2ea043; }
.btn-yellow { background: var(--yellow); color: #fff; }
.btn-yellow:hover { background: #b8860b; }
.btn-muted-action { background: var(--border); color: var(--muted); }
.btn-muted-action:hover { background: #484f58; }

/* Welcome message */
.welcome-msg {
  align-self: flex-start;
  background: var(--panel);
  border: 1px solid var(--border);
  border-left: 3px solid var(--accent);
  border-radius: 12px;
  border-bottom-left-radius: 4px;
  padding: 16px 20px;
  max-width: 75%;
  font-size: 14px;
  line-height: 1.6;
  color: var(--text);
}

/* Thinking indicator */
.thinking {
  align-self: flex-start;
  display: none;
  align-items: center;
  gap: 6px;
  padding: 10px 14px;
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 12px;
  border-bottom-left-radius: 4px;
  font-size: 12px;
  color: var(--muted);
}
.thinking.visible { display: flex; }
.thinking-dots span {
  display: inline-block;
  width: 5px;
  height: 5px;
  background: var(--muted);
  border-radius: 50%;
  animation: dot-pulse 1.2s infinite;
}
.thinking-dots span:nth-child(2) { animation-delay: 0.2s; }
.thinking-dots span:nth-child(3) { animation-delay: 0.4s; }
@keyframes dot-pulse {
  0%, 80%, 100% { opacity: 0.3; transform: scale(0.8); }
  40% { opacity: 1; transform: scale(1); }
}

/* ---- Input Bar ---- */
.input-bar {
  padding: 12px 24px;
  border-top: 1px solid var(--border);
  background: var(--panel);
  display: flex;
  gap: 8px;
  align-items: flex-end;
}
.input-bar textarea {
  flex: 1;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 8px;
  color: var(--text);
  font-family: inherit;
  font-size: 13px;
  padding: 10px 12px;
  resize: none;
  min-height: 40px;
  max-height: 120px;
  line-height: 1.4;
  outline: none;
}
.input-bar textarea:focus { border-color: var(--accent); }
.input-bar textarea::placeholder { color: var(--muted); }
.send-btn {
  background: var(--accent);
  border: none;
  border-radius: 8px;
  color: #fff;
  cursor: pointer;
  width: 40px;
  height: 40px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.send-btn:hover { background: #4090e0; }
.send-btn:disabled { opacity: 0.4; cursor: default; }
.send-btn svg { width: 18px; height: 18px; }

/* ---- Right Sidebar ---- */
.right-section {
  flex: 1;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
}
.right-section-fixed {
  flex-shrink: 0;
}

/* Signal Feed */
.signal-feed {
  flex: 1;
  overflow-y: auto;
  min-height: 100px;
}
.signal-filter {
  padding: 6px 12px;
  border-bottom: 1px solid var(--border);
}
.signal-filter select {
  background: var(--bg);
  border: 1px solid var(--border);
  color: var(--text);
  font-size: 11px;
  padding: 3px 6px;
  border-radius: 4px;
  font-family: inherit;
  outline: none;
}
.signal-entry {
  padding: 4px 12px;
  font-size: 11px;
  display: flex;
  gap: 6px;
  align-items: baseline;
  border-bottom: 1px solid rgba(48,54,61,0.5);
}
.signal-time {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  color: var(--muted);
  flex-shrink: 0;
}
.signal-source {
  font-size: 9px;
  font-weight: 600;
  text-transform: uppercase;
  padding: 1px 5px;
  border-radius: 3px;
  flex-shrink: 0;
}
.source-email { background: rgba(88,166,255,0.15); color: var(--accent); }
.source-calendar { background: rgba(63,185,80,0.15); color: var(--green); }
.source-desktop { background: rgba(210,153,34,0.15); color: var(--yellow); }
.source-browser { background: rgba(248,81,73,0.15); color: var(--red); }
.source-slack { background: rgba(188,140,255,0.15); color: #bc8cff; }
.source-default { background: rgba(125,133,144,0.15); color: var(--muted); }
.signal-text {
  color: var(--text);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  flex: 1;
}

/* Analysis History */
.analysis-item {
  padding: 8px 12px;
  border-bottom: 1px solid var(--border);
  font-size: 11px;
  cursor: pointer;
}
.analysis-item:hover { background: rgba(88,166,255,0.04); }
.analysis-time {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  color: var(--muted);
}
.analysis-counts {
  display: flex;
  gap: 10px;
  margin-top: 2px;
}
.analysis-count {
  font-size: 10px;
}
.analysis-count.matches { color: var(--green); }
.analysis-count.skipped { color: var(--muted); }
.analysis-detail {
  display: none;
  margin-top: 6px;
  font-size: 11px;
  color: var(--muted);
  border-top: 1px solid var(--border);
  padding-top: 6px;
}
.analysis-item.expanded .analysis-detail { display: block; }

/* Pending Actions (right sidebar) */
.pending-item {
  padding: 8px 12px;
  border-bottom: 1px solid var(--border);
  font-size: 12px;
}
.pending-meta {
  display: flex;
  gap: 6px;
  align-items: center;
  margin-bottom: 4px;
}
.pending-type {
  font-size: 9px;
  font-weight: 600;
  text-transform: uppercase;
  padding: 1px 5px;
  border-radius: 3px;
  background: rgba(210,153,34,0.15);
  color: var(--yellow);
}
.pending-goal {
  font-size: 10px;
  color: var(--muted);
}
.pending-title {
  color: var(--text);
  margin-bottom: 6px;
}
.pending-buttons {
  display: flex;
  gap: 4px;
}
.pending-buttons button {
  font-size: 10px;
  padding: 3px 10px;
  border: none;
  border-radius: 4px;
  cursor: pointer;
  font-weight: 500;
  font-family: inherit;
}
.btn-run-agents {
  width: calc(100% - 24px);
  margin: 8px 12px;
  padding: 8px;
  background: var(--accent);
  color: #fff;
  border: none;
  border-radius: 6px;
  cursor: pointer;
  font-size: 12px;
  font-weight: 600;
  font-family: inherit;
}
.btn-run-agents:hover { background: #4090e0; }

/* Scrollbar */
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--muted); }
</style>
</head>
<body>

<!-- Top Bar -->
<div class="topbar">
  <span class="topbar-logo">work</span>
  <div class="topbar-status">
    <span class="status-dot" id="status-dot"></span>
    <span id="status-text">monitoring</span>
  </div>
  <span class="topbar-user">david@davidwurtz</span>
</div>

<!-- Main Layout -->
<div class="main-layout">

  <!-- Left Sidebar -->
  <div class="sidebar-left">
    <!-- Goals -->
    <div class="section-header" onclick="toggleSection(this)">
      <span class="section-chevron">&#9660;</span>
      Goals
    </div>
    <div class="section-body" id="goals-body" style="max-height:9999px">
      <div id="goals-list"></div>
      <button class="btn-add-goal" onclick="addGoal()">+ Add Goal</button>
    </div>

    <!-- Memory -->
    <div class="section-header" onclick="toggleSection(this)">
      <span class="section-chevron">&#9660;</span>
      Memory
    </div>
    <div class="section-body" id="memory-body" style="max-height:9999px">
      <div id="memory-list"></div>
    </div>

    <!-- Actions -->
    <div class="section-header" onclick="toggleSection(this)">
      <span class="section-chevron">&#9660;</span>
      Actions
      <span class="section-badge" id="actions-badge" style="display:none">0</span>
    </div>
    <div class="section-body" id="actions-body" style="max-height:9999px">
      <div id="actions-list"></div>
    </div>
  </div>

  <!-- Center Panel -->
  <div class="center-panel">
    <div class="conversation" id="conversation"></div>
    <div class="input-bar">
      <textarea id="chat-input" placeholder="Send a message..." rows="1"></textarea>
      <button class="send-btn" id="send-btn" onclick="handleSend()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
      </button>
    </div>
  </div>

  <!-- Right Sidebar -->
  <div class="sidebar-right">
    <!-- Live Signal Feed -->
    <div class="section-header right-section-fixed" onclick="toggleSection(this)">
      <span class="section-chevron">&#9660;</span>
      Live Signals
    </div>
    <div class="section-body" style="max-height:9999px; display:flex; flex-direction:column; flex:1; min-height:0;">
      <div class="signal-filter">
        <select id="signal-filter" onchange="renderSignals()">
          <option value="all">All sources</option>
          <option value="email">Email</option>
          <option value="calendar">Calendar</option>
          <option value="desktop">Desktop</option>
          <option value="browser">Browser</option>
          <option value="slack">Slack</option>
        </select>
      </div>
      <div class="signal-feed" id="signal-feed"></div>
    </div>

    <!-- Analysis History -->
    <div class="section-header right-section-fixed" onclick="toggleSection(this)">
      <span class="section-chevron">&#9660;</span>
      Analysis History
    </div>
    <div class="section-body" style="max-height:9999px">
      <div id="analysis-list"></div>
    </div>

    <!-- Pending Actions -->
    <div class="section-header right-section-fixed" onclick="toggleSection(this)">
      <span class="section-chevron">&#9660;</span>
      Pending Actions
      <span class="section-badge" id="pending-badge" style="display:none">0</span>
    </div>
    <div class="section-body" style="max-height:9999px">
      <div id="pending-list"></div>
      <button class="btn-run-agents" onclick="runAgents()">Run Agents</button>
    </div>
  </div>

</div>

<script>
// ---- State ----
let conversation = [];
let allGoals = [];
let allSignals = [];
let allPending = [];
let allMemory = [];
let allActions = [];
let allAnalysis = [];
let wsConnected = false;
let sending = false;
let lastConversationLength = 0;

// ---- Helpers ----
function formatTime(ts) {
  if (!ts) return '';
  const d = new Date(ts);
  return d.toLocaleTimeString([], {hour: '2-digit', minute: '2-digit'});
}

function getGreeting() {
  const h = new Date().getHours();
  if (h < 12) return 'Good morning';
  if (h < 17) return 'Good afternoon';
  return 'Good evening';
}

function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

// ---- Markdown ----
function renderMarkdown(text) {
  // Escape HTML first
  let html = escapeHtml(text);

  // Code blocks (``` ... ```)
  html = html.replace(/```(\w*)\n?([\s\S]*?)```/g, function(_, lang, code) {
    return '<pre><code>' + code.trim() + '</code></pre>';
  });

  // Inline code
  html = html.replace(/`([^`]+)`/g, '<code>$1</code>');

  // Bold
  html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');

  // Italic
  html = html.replace(/\*(.+?)\*/g, '<em>$1</em>');

  // Headers
  html = html.replace(/^### (.+)$/gm, '<h4>$1</h4>');
  html = html.replace(/^## (.+)$/gm, '<h3>$1</h3>');

  // Links
  html = html.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank">$1</a>');

  // Bullet lists: collect consecutive lines starting with -
  html = html.replace(/(^- .+$\n?)+/gm, function(block) {
    const items = block.trim().split('\n').map(line => {
      return '<li>' + line.replace(/^- /, '') + '</li>';
    }).join('');
    return '<ul>' + items + '</ul>';
  });

  // Action cards: [ACTION:title|content|buttons]
  html = html.replace(/\[ACTION:([^|]+)\|([^|]+)\|([^\]]+)\]/g, function(_, title, content, buttons) {
    const btns = buttons.split(',').map(b => {
      const parts = b.trim().split(':');
      const label = parts[0];
      const style = parts[1] || 'muted-action';
      return '<button class="btn-' + style + '">' + label + '</button>';
    }).join('');
    return '<div class="action-card"><div class="action-card-title">' + title +
      '</div><div class="action-card-content">' + content +
      '</div><div class="action-card-buttons">' + btns + '</div></div>';
  });

  // Line breaks (but not after block elements)
  html = html.replace(/\n/g, '<br>');
  // Clean up extra <br> after block elements
  html = html.replace(/<\/(pre|ul|h3|h4)><br>/g, '</$1>');
  html = html.replace(/<br><(pre|ul|h3|h4)/g, '<$1');

  return html;
}

// ---- Section Toggle ----
function toggleSection(header) {
  header.classList.toggle('collapsed');
}

// ---- API Calls ----
async function apiGet(path) {
  try {
    const resp = await fetch(path);
    if (!resp.ok) return null;
    return await resp.json();
  } catch (e) {
    return null;
  }
}

async function apiPost(path, body) {
  try {
    const resp = await fetch(path, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(body),
    });
    if (!resp.ok) return null;
    return await resp.json();
  } catch (e) {
    return null;
  }
}

async function loadConversation() {
  const data = await apiGet('/api/chat');
  if (data && Array.isArray(data)) {
    const hadNew = data.length > lastConversationLength && lastConversationLength > 0;
    conversation = data;
    lastConversationLength = data.length;
    renderConversation();
    if (hadNew) scrollToBottom(true);
  }
}

async function sendMessage(text) {
  const data = await apiPost('/api/chat', {message: text});
  return data;
}

async function loadGoals() {
  const data = await apiGet('/api/goals');
  if (data && Array.isArray(data)) {
    allGoals = data;
    renderGoals();
  }
}

async function loadSignals() {
  const data = await apiGet('/api/signals?limit=50');
  if (data && Array.isArray(data)) {
    allSignals = data;
    renderSignals();
  }
}

async function loadPending() {
  const data = await apiGet('/api/pending');
  if (data && Array.isArray(data)) {
    allPending = data;
    renderPending();
  }
}

async function loadMemory() {
  const data = await apiGet('/api/memory');
  if (data && Array.isArray(data)) {
    allMemory = data;
    renderMemory();
  }
}

async function loadActions() {
  const data = await apiGet('/api/actions');
  if (data && Array.isArray(data)) {
    allActions = data;
    renderActions();
  }
}

async function loadAnalysis() {
  const data = await apiGet('/api/analysis?limit=5');
  if (data && Array.isArray(data)) {
    allAnalysis = data;
    renderAnalysis();
  }
}

async function loadStatus() {
  const data = await apiGet('/api/status');
  if (data) {
    const dot = document.getElementById('status-dot');
    const text = document.getElementById('status-text');
    if (data.monitoring) {
      dot.className = 'status-dot';
      text.textContent = 'monitoring';
    } else {
      dot.className = 'status-dot stopped';
      text.textContent = 'stopped';
    }
  }
}

// ---- Rendering ----
function renderConversation() {
  const el = document.getElementById('conversation');
  let html = '';

  if (conversation.length === 0) {
    html = '<div class="welcome-msg">' + getGreeting() +
      ', David. I\'m monitoring your desktop, messages, and email. ' +
      'Ask me anything or I\'ll let you know when something needs your attention.</div>';
  }

  conversation.forEach(msg => {
    const time = formatTime(msg.timestamp);
    if (msg.role === 'user') {
      html += '<div class="msg msg-user">' + escapeHtml(msg.content) +
        '<div class="msg-time">' + time + '</div></div>';
    } else if (msg.proactive) {
      html += '<div class="msg msg-proactive"><span class="proactive-icon">\uD83D\uDD14</span>' +
        renderMarkdown(msg.content) +
        '<div class="msg-time">' + time + '</div></div>';
    } else {
      html += '<div class="msg msg-agent">' + renderMarkdown(msg.content) +
        '<div class="msg-time">' + time + '</div></div>';
    }
  });

  // Thinking indicator
  html += '<div class="thinking" id="thinking"><div class="thinking-dots"><span></span><span></span><span></span></div> Thinking...</div>';

  el.innerHTML = html;
}

function scrollToBottom(smooth) {
  const el = document.getElementById('conversation');
  if (smooth) {
    el.scrollTo({top: el.scrollHeight, behavior: 'smooth'});
  } else {
    el.scrollTop = el.scrollHeight;
  }
}

function showThinking() {
  const el = document.getElementById('thinking');
  if (el) el.classList.add('visible');
  scrollToBottom(true);
}

function hideThinking() {
  const el = document.getElementById('thinking');
  if (el) el.classList.remove('visible');
}

function renderGoals() {
  const el = document.getElementById('goals-list');
  if (!allGoals.length) {
    el.innerHTML = '<div style="padding:12px;color:var(--muted);font-size:11px">No goals yet</div>';
    return;
  }
  let html = '';
  allGoals.forEach(g => {
    const proposed = g.proposed || g.status === 'proposed';
    html += '<div class="goal-item' + (proposed ? ' proposed' : '') + '" onclick="talkAboutGoal(\'' + escapeHtml((g.name || g.title || '').replace(/'/g, "\\'")) + '\')">';
    html += '<span class="goal-icon">' + (g.icon || '\uD83C\uDFAF') + '</span>';
    html += '<span class="goal-name">' + escapeHtml(g.name || g.title || 'Untitled') + '</span>';
    if (g.scope) html += '<span class="goal-scope">' + escapeHtml(g.scope) + '</span>';
    if (proposed) {
      html += '<div class="goal-actions">' +
        '<button class="btn-accept" onclick="event.stopPropagation();acceptGoal(\'' + (g.id || '') + '\')">Accept</button>' +
        '<button class="btn-reject" onclick="event.stopPropagation();rejectGoal(\'' + (g.id || '') + '\')">Reject</button>' +
        '</div>';
    }
    html += '</div>';
  });
  el.innerHTML = html;
}

function renderMemory() {
  const el = document.getElementById('memory-list');
  if (!allMemory.length) {
    el.innerHTML = '<div style="padding:12px;color:var(--muted);font-size:11px">No memory entries</div>';
    return;
  }
  let html = '';
  allMemory.forEach((m, i) => {
    html += '<div class="memory-item" onclick="this.querySelector(\'.memory-text\').classList.toggle(\'expanded\')">';
    if (m.scope) html += '<div class="memory-scope">' + escapeHtml(m.scope) + '</div>';
    html += '<div class="memory-text">' + escapeHtml(m.text || m.content || JSON.stringify(m)) + '</div>';
    html += '</div>';
  });
  el.innerHTML = html;
}

function renderActions() {
  const el = document.getElementById('actions-list');
  const badge = document.getElementById('actions-badge');
  if (!allActions.length) {
    el.innerHTML = '<div style="padding:12px;color:var(--muted);font-size:11px">No tracked actions</div>';
    badge.style.display = 'none';
    return;
  }
  badge.textContent = allActions.length;
  badge.style.display = '';
  let html = '';
  allActions.forEach(a => {
    html += '<div class="action-item">';
    html += '<div class="action-item-type">' + escapeHtml(a.type || 'action') + '</div>';
    html += '<div class="action-item-title">' + escapeHtml(a.title || a.name || '') + '</div>';
    html += '</div>';
  });
  el.innerHTML = html;
}

function renderSignals() {
  const el = document.getElementById('signal-feed');
  const filter = document.getElementById('signal-filter').value;
  const filtered = filter === 'all' ? allSignals : allSignals.filter(s => (s.source || '').toLowerCase() === filter);

  if (!filtered.length) {
    el.innerHTML = '<div style="padding:12px;color:var(--muted);font-size:11px;text-align:center">No signals yet</div>';
    return;
  }

  let html = '';
  filtered.forEach(s => {
    const src = (s.source || 'unknown').toLowerCase();
    const srcClass = 'source-' + (['email','calendar','desktop','browser','slack'].includes(src) ? src : 'default');
    html += '<div class="signal-entry">';
    html += '<span class="signal-time">' + formatTime(s.timestamp) + '</span>';
    html += '<span class="signal-source ' + srcClass + '">' + escapeHtml(src) + '</span>';
    html += '<span class="signal-text">' + escapeHtml(s.text || s.summary || s.title || '') + '</span>';
    html += '</div>';
  });
  el.innerHTML = html;

  // Auto-scroll signal feed to bottom
  el.scrollTop = el.scrollHeight;
}

function renderAnalysis() {
  const el = document.getElementById('analysis-list');
  if (!allAnalysis.length) {
    el.innerHTML = '<div style="padding:12px;color:var(--muted);font-size:11px">No analysis yet</div>';
    return;
  }
  let html = '';
  allAnalysis.forEach(a => {
    const matches = a.matches || a.matched || 0;
    const skipped = a.skipped || 0;
    html += '<div class="analysis-item" onclick="this.classList.toggle(\'expanded\')">';
    html += '<div class="analysis-time">' + formatTime(a.timestamp) + '</div>';
    html += '<div class="analysis-counts">';
    html += '<span class="analysis-count matches">' + matches + ' matched</span>';
    html += '<span class="analysis-count skipped">' + skipped + ' skipped</span>';
    html += '</div>';
    if (a.details || a.summary) {
      html += '<div class="analysis-detail">' + escapeHtml(a.details || a.summary || '') + '</div>';
    }
    html += '</div>';
  });
  el.innerHTML = html;
}

function renderPending() {
  const el = document.getElementById('pending-list');
  const badge = document.getElementById('pending-badge');
  if (!allPending.length) {
    el.innerHTML = '<div style="padding:12px;color:var(--muted);font-size:11px">No pending actions</div>';
    badge.style.display = 'none';
    return;
  }
  badge.textContent = allPending.length;
  badge.style.display = '';
  let html = '';
  allPending.forEach(p => {
    html += '<div class="pending-item">';
    html += '<div class="pending-meta">';
    html += '<span class="pending-type">' + escapeHtml(p.type || 'action') + '</span>';
    if (p.goal) html += '<span class="pending-goal">' + escapeHtml(p.goal) + '</span>';
    html += '</div>';
    html += '<div class="pending-title">' + escapeHtml(p.title || p.name || '') + '</div>';
    html += '<div class="pending-buttons">';
    html += '<button class="btn-green" onclick="approvePending(\'' + (p.id || '') + '\')">Approve</button>';
    html += '<button class="btn-muted-action" onclick="dismissPending(\'' + (p.id || '') + '\')">Dismiss</button>';
    html += '</div>';
    html += '</div>';
  });
  el.innerHTML = html;
}

// ---- Chat ----
async function handleSend() {
  const input = document.getElementById('chat-input');
  const text = input.value.trim();
  if (!text || sending) return;

  input.value = '';
  input.style.height = 'auto';
  sending = true;

  // Add user message immediately
  conversation.push({role: 'user', content: text, timestamp: new Date().toISOString()});
  lastConversationLength = conversation.length;
  renderConversation();
  scrollToBottom();
  showThinking();

  // Send to API
  const data = await sendMessage(text);

  hideThinking();
  sending = false;

  if (data && data.response) {
    conversation.push({
      role: 'agent',
      content: data.response,
      timestamp: data.timestamp || new Date().toISOString(),
      proactive: false,
    });
    lastConversationLength = conversation.length;
    renderConversation();
    scrollToBottom(true);
  }
}

// ---- Actions ----
function talkAboutGoal(name) {
  const input = document.getElementById('chat-input');
  input.value = "Let's talk about " + name;
  input.focus();
  handleSend();
}

function addGoal() {
  const input = document.getElementById('chat-input');
  input.value = 'I want to add a new goal: ';
  input.focus();
}

async function acceptGoal(id) {
  await apiPost('/api/goals/' + id + '/accept', {});
  loadGoals();
}

async function rejectGoal(id) {
  await apiPost('/api/goals/' + id + '/reject', {});
  loadGoals();
}

async function approvePending(id) {
  await apiPost('/api/pending/' + id + '/approve', {});
  loadPending();
}

async function dismissPending(id) {
  await apiPost('/api/pending/' + id + '/dismiss', {});
  loadPending();
}

async function runAgents() {
  await apiPost('/api/agents/run', {});
}

// ---- WebSocket ----
function connectWS() {
  try {
    const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
    const ws = new WebSocket(proto + '//' + location.host + '/ws/signals');
    ws.onopen = () => { wsConnected = true; };
    ws.onclose = () => {
      wsConnected = false;
      setTimeout(connectWS, 5000);
    };
    ws.onerror = () => { ws.close(); };
    ws.onmessage = (event) => {
      try {
        const signal = JSON.parse(event.data);
        allSignals.push(signal);
        // Keep last 200
        if (allSignals.length > 200) allSignals = allSignals.slice(-200);
        renderSignals();
      } catch (e) {}
    };
  } catch (e) {
    setTimeout(connectWS, 5000);
  }
}

// ---- Input Handling ----
const chatInput = document.getElementById('chat-input');

chatInput.addEventListener('keydown', function(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    handleSend();
  }
});

// Auto-resize textarea
chatInput.addEventListener('input', function() {
  this.style.height = 'auto';
  this.style.height = Math.min(this.scrollHeight, 120) + 'px';
});

// ---- Init ----
(async function init() {
  // Load everything in parallel
  await Promise.all([
    loadConversation(),
    loadGoals(),
    loadSignals(),
    loadPending(),
    loadMemory(),
    loadActions(),
    loadAnalysis(),
    loadStatus(),
  ]);

  // If conversation was empty, show welcome
  if (conversation.length === 0) {
    renderConversation();
  }
  scrollToBottom();

  // Connect WebSocket
  connectWS();

  // Polling
  setInterval(loadConversation, 5000);
  setInterval(loadGoals, 30000);
  setInterval(loadPending, 30000);
  setInterval(loadAnalysis, 60000);
  setInterval(loadSignals, 15000);
  setInterval(loadStatus, 30000);
})();
</script>
